header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Apache Software Foundation

  paths-ignore:
    - 'licenses'
    - 'licenses-3rd-party-code'
    - '**/*.csv'
    - '**/*.txt'
    - '**/*.json'
    - '**/*.jsonl'
    - 'DESCRIPTION'
    - 'DISCLAIMER'
    - 'LICENSE'
    - 'NOTICE'
    # Per-module LICENSE-binary / NOTICE-binary describing the third-party
    # content bundled in each module's binary artifact (Universal dist zip
    # or Docker image). Plain-text manifests, not source files.
    - '**/LICENSE-binary'
    - '**/LICENSE-binary-*'
    - '**/NOTICE-binary'
    - '**/NOTICE-binary-*'
    - '.dockerignore'
    - '**/.helmignore'
    - '.gitattributes'
    - '.github/PULL_REQUEST_TEMPLATE'
    - 'yarn.lock'
    - '.nvmrc'
    - '.htaccess'
    - '.gitkeep'
    - 'site.webmanifest'
    - '.gitignore'
    - '.licenserc.yaml'
    - 'amber/src/main/python/proto/**'
    - '**/.env.example'
    - '**/.prettierrc'
    - '**/bun.lock'
    # Third-party code with MIT license - see LICENSE file for attribution
    - 'common/workflow-operator/src/main/scala/com/kjetland/**'
    - 'amber/src/main/python/core/util/customized_queue/inner.py'
    - 'common/workflow-core/src/main/protobuf/scalapb/scalapb.proto'
