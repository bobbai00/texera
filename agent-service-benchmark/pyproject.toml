[project]
name = "agent-service-benchmark"
version = "0.1.0"
description = "Benchmarking client for Texera Agent Service using DABstep, Spider2-DBT, and KramaBench benchmarks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # DABstep benchmark
    "dabstep-benchmark",
    "datasets==3.2.0",
    "smolagents[litellm]==1.6.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "huggingface-hub>=0.20.0",
    # Spider2-DBT benchmark
    "duckdb>=1.0.0",
    "gdown>=5.0.0",
    # KramaBench benchmark
    "rouge-score>=0.1.2",
    "typeguard>=4.0.0",  # Required by KramaBench metrics
    "nltk>=3.8.0",       # Required by KramaBench metrics
]

[tool.uv.sources]
dabstep-benchmark = { git = "https://hf.co/spaces/adyen/DABstep.git", rev = "main" }
