name: texera-single-node
services:
  # Part1: Specification of the storage services used by Texera
  # RustFS is an S3-compatible object storage used to store datasets and files.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: texera-rustfs
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      - RUSTFS_ACCESS_KEY=${STORAGE_S3_AUTH_USERNAME}
      - RUSTFS_SECRET_KEY=${STORAGE_S3_AUTH_PASSWORD}
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      # Must match STORAGE_S3_REGION: the region is part of the SigV4 scope, and
      # LakeFS sends its blockstore region on every request.
      - RUSTFS_REGION=${STORAGE_S3_REGION}
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      # Empty log directory => log to stdout, so `docker compose logs rustfs`
      # works and no second volume is needed. `warn` keeps that readable; the
      # server is very chatty at info.
      - RUSTFS_OBS_LOG_DIRECTORY=
      - RUSTFS_OBS_LOGGER_LEVEL=warn
    volumes:
      - rustfs_data:/data
    # Also on the computing unit's network: a unit reads its input and writes its results here.
    networks:
      - default
      - unit
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # This job creates the S3 bucket the lake's Iceberg warehouses keep their files in; the
  # DashboardService creates the shared warehouse in Lakekeeper. `rc` is RustFS's S3 client, the
  # counterpart of the `mc` client this used to run.
  rustfs-init:
    image: rustfs/rc:v0.1.35
    container_name: texera-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    env_file:
      - .env
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rc alias set local "$$STORAGE_S3_ENDPOINT" "$$STORAGE_S3_AUTH_USERNAME" "$$STORAGE_S3_AUTH_PASSWORD" \
          --region "$$STORAGE_S3_REGION" --bucket-lookup path
        rc bucket create --ignore-existing "local/$$STORAGE_ICEBERG_CATALOG_REST_S3_BUCKET"
        echo "RustFS bucket '$$STORAGE_ICEBERG_CATALOG_REST_S3_BUCKET' is ready."
        # A computing unit's own user, which reaches only the large-binaries bucket: a unit
        # reads and writes the lake's tables only through the catalog. Each command leaves
        # what is there as it is, so this job may run again on a kept volume.
        BINARIES="$${STORAGE_S3_LARGE_BINARIES_BUCKET:-texera-large-binaries}"
        rc bucket create --ignore-existing "local/$$BINARIES"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' \
          "$$BINARIES" "$$BINARIES" > /tmp/unit-policy.json
        rc admin policy create local texera-unit-large-binaries /tmp/unit-policy.json
        rc admin user add local "$$STORAGE_S3_UNIT_AUTH_USERNAME" "$$STORAGE_S3_UNIT_AUTH_PASSWORD"
        rc admin policy attach local texera-unit-large-binaries --user "$$STORAGE_S3_UNIT_AUTH_USERNAME"
        echo "RustFS user '$$STORAGE_S3_UNIT_AUTH_USERNAME' reaches only bucket '$$BINARIES'."

  # PostgreSQL with PGroonga extension for full-text search.
  # Used by lakeFS and Texera's metadata storage.
  postgres:
    image: groonga/pgroonga:4.0.1-debian-15
    container_name: texera-postgres
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "texera", "-d", "texera_db"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # mount the sql files for initializing the postgres
      - ../../sql:/docker-entrypoint-initdb.d
    # Also on OpenFGA's network, which keeps its data here.
    networks:
      - default
      - authz

  # lakeFS is the underlying storage of Texera's dataset service
  lakefs:
    image: treeverse/lakefs:1.51
    container_name: texera-lakefs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    env_file:
      - .env
    environment:
      # This port also need to be changed if the port of RustFS service is changed
      - LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_ENDPOINT=${TEXERA_HOST}:${RUSTFS_PORT:-9000}
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID=${STORAGE_S3_AUTH_USERNAME}
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY=${STORAGE_S3_AUTH_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        lakefs setup --user-name "$LAKEFS_INSTALLATION_USER_NAME" --access-key-id "$LAKEFS_INSTALLATION_ACCESS_KEY_ID" --secret-access-key "$LAKEFS_INSTALLATION_SECRET_ACCESS_KEY" || true
        lakefs run &
        wait
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/v1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10

  # This job applies OpenFGA's database schema to the Postgres instance, creating or upgrading
  # the tables OpenFGA keeps its data in.
  openfga-migrate:
    image: openfga/openfga:v1.11.2
    container_name: texera-openfga-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: "no"
    command: ["migrate"]
    networks:
      - authz

  # OpenFGA keeps what each caller of the lake's catalog may do: Lakekeeper records there who
  # may use each namespace and who made each table, and asks it about every request. Only
  # Lakekeeper calls it, so it is on OpenFGA's network alone: neither a computing unit nor
  # JupyterLab, where users run their own code, reaches it.
  openfga:
    image: openfga/openfga:v1.11.2
    container_name: texera-openfga
    restart: unless-stopped
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    command: ["run"]
    networks:
      - authz
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 3s
      retries: 10

  # This job applies Lakekeeper's database schema to the Postgres instance —
  # creating or upgrading the tables that Lakekeeper uses to track its catalog metadata —
  # and writes the authorization model Lakekeeper keeps in OpenFGA.
  lakekeeper-migrate:
    image: vakamo/lakekeeper:v0.11.0
    container_name: texera-lakekeeper-migrate
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy
    env_file:
      - .env
    restart: "no"
    entrypoint: ["/home/nonroot/lakekeeper"]
    command: ["migrate"]
    networks:
      - default
      - authz

  # Lakekeeper is the Iceberg REST catalog service. It refuses a request without a token the
  # services signed: when it starts, it reads the key to check them with at the
  # AccessControlService, and it stops when it cannot.
  lakekeeper:
    image: vakamo/lakekeeper:v0.11.0
    container_name: texera-lakekeeper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      lakekeeper-migrate:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      access-control-service:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: ["/home/nonroot/lakekeeper"]
    command: ["serve"]
    # Also on the computing unit's network: the lake's catalog is the one service a unit calls.
    # And on OpenFGA's, as its one caller.
    networks:
      - default
      - unit
      - authz
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Part2: Specification of Texera's micro-services
  # FileService provides endpoints for Texera's dataset management
  file-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-file-service:${IMAGE_TAG:-latest}
    container_name: file-service
    restart: unless-stopped
    depends_on:
      rustfs:
        condition: service_started
      lakefs:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9092/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ConfigService provides endpoints for configuration management
  config-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-config-service:${IMAGE_TAG:-latest}
    container_name: config-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9094/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # AccessControlService handles user permissions and proxies LLM API traffic
  access-control-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-access-control-service:${IMAGE_TAG:-latest}
    container_name: access-control-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9096/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # WorkflowComputingUnitManagingService provides endpoints for managing computing units
  workflow-computing-unit-managing-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-workflow-computing-unit-managing-service:${IMAGE_TAG:-latest}
    container_name: workflow-computing-unit-managing-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # WorkflowCompilingService provides endpoints for sanity check and schema propagation while workflows are being edited,
  # and makes the plan of each execution the DashboardService creates
  workflow-compiling-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-workflow-compiling-service:${IMAGE_TAG:-latest}
    container_name: workflow-compiling-service
    restart: unless-stopped
    depends_on:
      file-service:
        condition: service_started
      # The plan of a run says where LakeFS keeps each dataset file the workflow reads.
      lakefs:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # WorkflowRuntimeCoordinatorService is the computing unit: it runs the executions the
  # DashboardService hands it, and serves the websocket a browser watches and steers a run over.
  workflow-runtime-coordinator-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-workflow-execution-coordinator:${IMAGE_TAG:-latest}
    container_name: workflow-runtime-coordinator-service
    restart: unless-stopped
    depends_on:
      lakekeeper:
        condition: service_healthy
    # No env_file here on purpose. A computing unit runs users' code, so it is given only what a
    # unit needs, not the whole .env (which holds the database, LakeFS and LiteLLM credentials,
    # and the key the services sign tokens with when AUTH_JWT_SECRET is set): the list the unit
    # manager gives a unit it creates in Kubernetes, and the services' log level. A variable
    # named without a value is taken from .env, or from the shell, and left out when neither
    # sets it.
    environment:
      - TEXERA_SERVICE_LOG_LEVEL
      # The lake's catalog, where a unit keeps everything a run produces and records. No
      # credential for it is set here: the plan of each execution comes with the token that
      # execution's requests carry, which reaches only the execution's own namespace. A unit
      # has no route to Postgres: STORAGE_ICEBERG_CATALOG_TYPE=postgres needs its three
      # STORAGE_ICEBERG_CATALOG_POSTGRES_* variables added here and postgres on the unit network.
      - STORAGE_ICEBERG_CATALOG_TYPE
      - STORAGE_ICEBERG_CATALOG_REST_URI
      - STORAGE_ICEBERG_CATALOG_REST_WAREHOUSE_NAME
      # The object store, with the unit's own user, which reaches only the large-binaries
      # bucket (rustfs-init makes it).
      - STORAGE_S3_ENDPOINT
      - STORAGE_S3_REGION
      - STORAGE_S3_AUTH_USERNAME=${STORAGE_S3_UNIT_AUTH_USERNAME}
      - STORAGE_S3_AUTH_PASSWORD=${STORAGE_S3_UNIT_AUTH_PASSWORD}
      - FILE_SERVICE_GET_DATASET_PRESIGNED_URL_ENDPOINT
      # Overrides, each with a default in the unit's own configuration.
      - MAX_WORKFLOW_WEBSOCKET_REQUEST_PAYLOAD_SIZE_KB
      - STORAGE_INPUT_LINKS_ALLOWED_ENDPOINTS
      - UDF_PYTHON_ENVIRONMENTS_ROOT
      - UDF_PYTHON_ENVIRONMENTS_INSTALL_TIMEOUT_MINUTES
      - STORAGE_ICEBERG_CATALOG_REST_CONNECTION_TIMEOUT_MS
      - STORAGE_ICEBERG_CATALOG_REST_SOCKET_TIMEOUT_MS
      - STORAGE_ICEBERG_TABLE_COMMIT_INTERVAL_MS
      # Observability: a unit emits to the collector once OTEL_SDK_DISABLED=false.
      - OTEL_SDK_DISABLED
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - TEXERA_OTEL_ALLOWED_HOSTS
      - OTEL_METRIC_EXPORT_INTERVAL
    # A network of its own, not the services': a unit reaches the lake's catalog and the object
    # store, and only the gateway, the DashboardService and the AgentService reach a unit. It
    # verifies no token, and takes their word for who a request is from.
    networks:
      - unit
    volumes:
      - workflow_result_data:/amber/user-resources

  # DashboardService provides endpoints for community resource (e.g. workflows, users) management
  dashboard-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-dashboard-service:${IMAGE_TAG:-latest}
    container_name: dashboard-service
    restart: unless-stopped
    depends_on:
      workflow-runtime-coordinator-service:
        condition: service_started
      workflow-compiling-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      # Creating an execution asks the compiling service for its plan (above). Each execution's
      # log, records and results are read from the lake, in a warehouse of Lakekeeper's, and
      # dropped there when they expire. It also sets the lake up: when it starts it creates the
      # shared warehouse, in the bucket rustfs-init creates, and for each execution it creates
      # the namespace the execution's tables go in and the token that may use it.
      lakekeeper:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      lakefs:
        condition: service_healthy
    env_file:
      - .env
    # Also on the computing unit's network: it hands the unit each execution's plan.
    networks:
      - default
      - unit
    volumes:
      - workflow_result_data:/amber/user-resources
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # LLM API proxy for different providers
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.10-stable
    container_name: litellm
    restart: unless-stopped
    # Keys read from shell first, falling back to .env.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # AgentService manages the texera agents' interal states, and provide endpoints for CRUD agents
  agent-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-agent-service:${IMAGE_TAG:-latest}
    container_name: agent-service
    restart: unless-stopped
    depends_on:
      dashboard-service:
        condition: service_healthy
      workflow-compiling-service:
        condition: service_healthy
      workflow-runtime-coordinator-service:
        condition: service_started
    env_file:
      - .env
    # Also on the computing unit's network: it waits there for the executions it asked for.
    networks:
      - default
      - unit
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NotebookMigrationService provides endpoints for the Jupyter notebook migration tool
  notebook-migration-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-notebook-migration-service:${IMAGE_TAG:-latest}
    container_name: notebook-migration-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Interpolation only works in the compose file, not inside .env, so the
      # browser-facing URL is composed here (same as lakefs's pre-signed endpoint).
      - STORAGE_JUPYTER_PUBLIC_URL=${TEXERA_HOST}:${JUPYTER_PORT:-9100}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9098/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # JupyterLab instance that the notebook migration tool embeds in an iframe.
  # Its port is published because the browser loads it directly, not through the gateway
  # (STORAGE_JUPYTER_PUBLIC_URL); notebook-migration-service reaches it in-network
  # via STORAGE_JUPYTER_INTERNAL_URL.
  jupyter:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-jupyter:${IMAGE_TAG:-latest}
    container_name: texera-jupyter
    restart: unless-stopped
    ports:
      - "${JUPYTER_PORT:-9100}:8888"
    # No env_file here on purpose. Users run arbitrary code in Jupyter, so this
    # container gets only the two values it needs, not the whole .env (which holds
    # the DB, S3, LakeFS, and LiteLLM credentials). It also keeps JUPYTER_PORT out:
    # the base image reads it and would move the server off 8888.
    environment:
      # Texera app origin for the iframe CSP frame-ancestors and custom.js postMessage checks.
      - TEXERA_ORIGIN=${TEXERA_HOST}:${TEXERA_PORT:-8080}
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-texera}
    healthcheck:
      # /api returns the server version without requiring the token, so it is a
      # reliable liveness probe even with auth enabled.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/api')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ResultService serves the results of executions, so they can be read without a computing unit.
  # It reads them through Lakekeeper, so it needs STORAGE_ICEBERG_CATALOG_TYPE=rest (the default).
  # With postgres, result tables are the computing unit's local files, which this does not mount.
  result-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/apache}/texera-result-service:${IMAGE_TAG:-latest}
    container_name: result-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9102/api/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Part 3: the gateway in front of Texera's micro services
  # Envoy, the proxy the Kubernetes deployment runs too, with envoy.yaml saying what Envoy Gateway
  # says there: a request for a service goes to that service, and a computing unit's websocket
  # goes to the unit once the AccessControlService has said who the caller is.
  gateway:
    image: envoyproxy/envoy:distroless-v1.36.4
    container_name: texera-gateway
    depends_on:
      - workflow-compiling-service
      - file-service
      - dashboard-service
      - workflow-runtime-coordinator-service
      - config-service
      - access-control-service
      - workflow-computing-unit-managing-service
      - agent-service
      - notebook-migration-service
      - result-service
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    # Also on the computing unit's network: a unit's websocket comes through here.
    networks:
      - default
      - unit
    ports:
      - "${TEXERA_PORT:-8080}:8080"

  startup-message:
    image: alpine:3.24.2
    depends_on:
      gateway:
        condition: service_started
    environment:
      - TEXERA_PORT=${TEXERA_PORT:-8080}
    restart: "no"
    command: >
      sh -c '
      echo "";
      echo "=========================================";
      echo "  Texera has started successfully!";
      echo "  Access at: http://localhost:$$TEXERA_PORT";
      echo "=========================================";
      echo "";
      '

  # Part 4: Optional one-shot jobs
  # Loads example datasets and workflows into Texera on first startup.
  # Only runs when the "examples" profile is activated:
  #   docker compose --profile examples up
  example-data-loader:
    image: alpine:3.24.2
    depends_on:
      dashboard-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    volumes:
      - ./examples:/examples:ro
    environment:
      - TEXERA_DASHBOARD_SERVICE_URL=http://dashboard-service:8080/api
      - TEXERA_FILE_SERVICE_URL=http://file-service:9092/api
      - TEXERA_EXAMPLE_USERNAME=${USER_SYS_ADMIN_USERNAME}
      - TEXERA_EXAMPLE_PASSWORD=${USER_SYS_ADMIN_PASSWORD}
    restart: "no"
    profiles:
      - examples
    command: >
      sh -c 'apk add --no-cache curl jq bash > /dev/null 2>&1 && bash /examples/load-examples.sh'

  # ========================================================================
  # Observability stack: collector + logs, metrics, traces, profiles.
  #
  # Each signal is a separate compose profile; enable them via
  # COMPOSE_PROFILES in bin/single-node/.env. Every port binds to
  # loopback (127.0.0.1) or stays on the bridge network; no 0.0.0.0
  # host bindings.
  # ========================================================================

  # OpenTelemetry Collector, the single OTLP ingress for all three
  # signals. Reads bin/observability/otel-collector/config.yaml.
  # Apache-2.0; pinned to the contrib distribution.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: texera-otel-collector
    profiles: [observability-collector]
    restart: always
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro,z
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # Also on the computing unit's network: a unit emits here once its telemetry is on.
    networks:
      - default
      - unit
    # In-compose services reach the OTLP receivers over the bridge
    # network as otel-collector:4317/:4318, so the base file publishes
    # no host ports. For a backend running outside docker (sbt /
    # IntelliJ), bin/local-dev/docker-compose.override.yml, which the
    # local-dev launcher loads, publishes them on the host loopback; the
    # released bundle omits that override.
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  # Loki (AGPLv3) log store. OTLP ingest at /otlp, LogQL query API on
  # 3100. AGPLv3, so it is an optional operator-run component and is NOT
  # shipped in any Texera release artifact (see bin/observability/README.md).
  # Reads bin/observability/loki/config.yaml.
  loki:
    image: grafana/loki:3.2.0
    container_name: texera-loki
    profiles: [observability-logs]
    restart: always
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../observability/loki/config.yaml:/etc/loki/config.yaml:ro,z
      - loki_data:/loki
    # Read-only root filesystem, so Loki's scratch space is an in-memory
    # tmpfs; all durable state lives on the loki_data volume under /loki.
    tmpfs:
      - /tmp
    command: ["-config.file=/etc/loki/config.yaml"]
    # Loopback-only host binding so an operator can curl the query
    # API from the host for ad-hoc debugging without exposing it to
    # the network.
    ports:
      - "127.0.0.1:3100:3100"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # Grafana (AGPLv3) dashboard/UI. Reads the Apache-2.0 backends below
  # (Loki, VictoriaMetrics, Jaeger) as pre-provisioned datasources. The UI
  # is meant to be opened by a human, but like the backends its port is
  # bound to loopback only (http://localhost:3000). AGPLv3, so it is an
  # optional operator-run component and is NOT shipped in any Texera
  # release artifact (see bin/observability/README.md).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: texera-grafana
    profiles: [observability-grafana]
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      - loki
      - victoriametrics
      - jaeger
    environment:
      # Admin login. Defaults are weak dev defaults; override in .env for
      # any deployment reachable beyond localhost.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-texera}
      # No anonymous access: the UI requires the admin login above.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Users cannot self-register.
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # Datasource provisioning (Loki + VictoriaMetrics + Jaeger), read-only.
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - grafana_data:/var/lib/grafana
    # Loopback-only host binding, like the backends: a human opens
    # http://localhost:3000, and the UI is never reachable from the
    # network by default.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # VictoriaMetrics, Apache-2.0 metrics store. Accepts Prometheus
  # remote-write from the collector at /api/v1/write, MetricsQL on
  # /api/v1/query.
  # Fix /data ownership before VictoriaMetrics starts. VM runs non-root
  # (uid 10003) with a read-only rootfs, but a freshly created named volume
  # is owned by root, so without this VM cannot create its lock file and
  # crash-loops. Idempotent on an existing volume.
  victoriametrics-init:
    image: alpine:3.19
    container_name: texera-victoriametrics-init
    profiles: [observability-metrics]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - chown -R 10003:10003 /data
    volumes:
      - victoriametrics_data:/data

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.144.0
    container_name: texera-victoriametrics
    profiles: [observability-metrics]
    restart: always
    user: "10003:10003"
    depends_on:
      victoriametrics-init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=90d"
      - "-httpListenAddr=:8428"
    volumes:
      - victoriametrics_data:/data
    ports:
      - "127.0.0.1:8428:8428"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # Jaeger v2, Apache-2.0 traces backend + UI. v2 accepts OTLP
  # natively. The query API lives at :16686, OTLP ingest at :4317
  # (kept inside the bridge network only, only the collector talks
  # to it).
  jaeger:
    image: jaegertracing/jaeger:2.18.0
    container_name: texera-jaeger
    profiles: [observability-traces]
    restart: always
    security_opt:
      - no-new-privileges:true
    # In-memory storage for the single-node deployment, restarts
    # wipe traces. Any deploy needing trace persistence must swap
    # in Cassandra or OpenSearch-backed storage here.
    ports:
      - "127.0.0.1:16686:16686"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # Parca server (Apache-2.0) profiles backend. Reads
  # bin/observability/parca/parca.yaml. FILESYSTEM storage.
  parca:
    image: ghcr.io/parca-dev/parca:v0.28.0
    container_name: texera-parca
    profiles: [observability-profiles]
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../observability/parca/parca.yaml:/parca.yaml:ro,z
      - parca_data:/var/lib/parca
    command:
      - "/parca"
      - "--config-path=/parca.yaml"
      # The default 5s HTTP read timeout cuts off multi-MB debuginfo (symbol) uploads mid-stream;
      # allow the whole debuginfo-upload-max-duration so symbolized flame graphs actually arrive.
      - "--http-read-timeout=15m"
    ports:
      - "127.0.0.1:7070:7070"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # Parca eBPF agent (Apache-2.0). Linux-only, privileged: it is the
  # only observability service needing elevated permissions, and it
  # profiles every process on the host, not just Texera's. Keep it
  # opt-in and read bin/observability/parca/README.md for the privilege
  # and scope implications before enabling it.
  parca-agent:
    image: ghcr.io/parca-dev/parca-agent:v0.47.1
    container_name: texera-parca-agent
    profiles: [observability-profiles]
    restart: always
    depends_on:
      parca:
        condition: service_started
    env_file:
      - ../observability/parca/parca-agent.env
    # eBPF requires CAP_SYS_ADMIN-class privileges. macOS / Windows
    # developers cannot run this, they should drop the
    # observability-profiles profile from COMPOSE_PROFILES.
    privileged: true
    pid: "host"
    # Bind-mount kernel state read-only, the agent reads /proc and
    # /sys for stack-trace symbolization but cannot write to either.
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    # parca-agent ships as a distroless image (no /bin/sh), so flags
    # are passed directly. env_file values above are kept as the
    # source of truth, edit both if you change a value.
    command:
      - "--remote-store-address=parca:7070"
      - "--remote-store-insecure=true"
      - "--node=texera-dev"
      - "--metadata-external-labels=deployment=texera;cluster=local"
      - "--profiling-cpu-sampling-frequency=19"
      - "--log-level=info"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  default:
    name: texera-single-node
  # The computing unit's: see workflow-runtime-coordinator-service.
  unit:
    name: texera-single-node-unit
  # OpenFGA's, which only Lakekeeper calls: OpenFGA asks for no credential, and whoever reaches it
  # can write any grant, so it is on no other network. Postgres is on it for OpenFGA's data.
  authz:
    name: texera-single-node-authz

# persistent volumes
volumes:
  rustfs_data:
  postgres_data:
  workflow_result_data:
  # Observability storage. Each backend gets its own named volume so
  # an operator can drop one signal's history (e.g. logs) without
  # touching the others.
  loki_data:
  grafana_data:
  victoriametrics_data:
  parca_data: