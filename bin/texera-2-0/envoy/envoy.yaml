# Envoy as the Texera 2.0 gateway (dev stack).
#
# Every route except the app, Keycloak and the well-known documents requires a Keycloak
# token (jwt_authn against the realm's JWKS) and is then checked by the catalog's PDP
# (ext_authz). Services behind the gateway run on the host during development.
static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                codec_type: AUTO
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
                xff_num_trusted_hops: 0
                route_config:
                  name: texera
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/auth/" }
                          route: { cluster: keycloak, timeout: 60s }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/.well-known/" }
                          route: { cluster: catalog, timeout: 15s }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        # The app's branding before anyone has logged in.
                        - match: { path: "/catalog/v1/settings/public" }
                          route: { cluster: catalog, timeout: 15s }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        # A watch streams for as long as the page stays open; keepalive comments
                        # every few seconds hold the connection.
                        - match: { safe_regex: { regex: "^/catalog/v1/resources/[^/]+/events$" } }
                          route: { cluster: catalog, timeout: 0s }
                        - match: { prefix: "/catalog/" }
                          route: { cluster: catalog, timeout: 600s }
                        # The bio MCP server checks its own API key; agents reach it through the gateway.
                        - match: { prefix: "/bio-mcp" }
                          route: { cluster: biomcp, timeout: 600s }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/access/" }
                          route: { cluster: catalog, timeout: 15s }
                        - match: { prefix: "/lineage/" }
                          route: { cluster: catalog, timeout: 15s }
                        # The MCP endpoint, /mcp/catalog. The slash matters: /mcp-servers/{rid} is a page of the app.
                        - match: { prefix: "/mcp/" }
                          route: { cluster: catalog, timeout: 600s }
                        - match: { prefix: "/agents/" }
                          route: { cluster: agent, timeout: 0s }
                        # The live sessions: a WebSocket for as long as a page stays open. A browser
                        # cannot put a token in a WebSocket's headers, so the person's token travels in
                        # the protocol's first message and the live service asks the catalog who it is.
                        - match: { prefix: "/live/" }
                          route: { cluster: live, timeout: 0s }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/" }
                          route: { cluster: frontend, timeout: 0s }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: http://localhost:8088/auth/realms/texera
                          audiences: ["texera"]
                          forward: true
                          payload_in_metadata: jwt_payload
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          from_params: ["access_token"]
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/auth/realms/texera/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: 300s
                            async_fetch: {}
                      rules:
                        - match: { prefix: "/auth/" }
                        - match: { prefix: "/.well-known/" }
                        - match: { prefix: "/mcp/" }
                          requires:
                            requires_any:
                              requirements:
                                - provider_name: keycloak
                                - allow_missing: {}
                        - match: { path: "/catalog/v1/settings/public" }
                        - match: { prefix: "/bio-mcp" }
                        - match: { prefix: "/catalog/" }
                          requires: { provider_name: keycloak }
                        - match: { prefix: "/access/" }
                          requires: { provider_name: keycloak }
                        - match: { prefix: "/lineage/" }
                          requires: { provider_name: keycloak }
                        - match: { prefix: "/agents/" }
                          requires: { provider_name: keycloak }
                        - match: { prefix: "/" }
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      http_service:
                        server_uri:
                          uri: http://host.docker.internal:8090
                          cluster: catalog
                          timeout: 5s
                        path_prefix: /access/v1/ext-authz
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: authorization
                              - exact: x-texera-agent
                              - exact: x-texera-service-token
                              - exact: x-texera-origin
                              - exact: content-type
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-texera-principal
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: keycloak
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: keycloak, port_value: 8080 }
    - name: catalog
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: catalog
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8090 }
    - name: agent
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 23002 }
    - name: live
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: live
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 23003 }
    - name: biomcp
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: biomcp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 23010 }
    - name: frontend
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: frontend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 5174 }
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
