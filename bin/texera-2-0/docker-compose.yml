# Texera 2.0 development stack: infrastructure in containers, the Go catalog, the agent
# runtime, the frontend and the computing unit on the host during development.
#
#   cd bin/texera-2-0 && docker compose up -d
#
# Envoy :8088 (host) is the only entrypoint. It verifies Keycloak tokens (JWKS) on every
# protected route and asks the catalog's PDP (ext_authz) before forwarding.
name: texera2

services:
  postgres:
    image: postgres:16-alpine
    container_name: texera2-postgres
    environment:
      POSTGRES_USER: texera
      POSTGRES_PASSWORD: texera
      POSTGRES_DB: catalog
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U texera -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: texera2-keycloak
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: texera
      KC_DB_PASSWORD: texera
      # The browser reaches Keycloak through Envoy, so tokens carry this issuer.
      KC_HOSTNAME: http://localhost:8088/auth
      # One URL set for browsers and services; dynamic backchannel URLs lose the gateway port.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/texera-realm.json:/opt/keycloak/data/import/texera-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -c 200 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30

  openfga-migrate:
    image: openfga/openfga:v1.11.2
    container_name: texera2-openfga-migrate
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://texera:texera@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1.11.2
    container_name: texera2-openfga
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://texera:texera@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD", "/openfga", "version"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao:
    image: openbao/openbao:2.4.1
    container_name: texera2-openbao
    # Dev mode: in-memory storage, unsealed, one root token. up.sh loads the platform's model
    # key on every start; credentials people create live as long as the container does.
    command: ["server", "-dev", "-dev-root-token-id=texera-dev-root", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:18200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

  openbao-init:
    image: openbao/openbao:2.4.1
    container_name: texera2-openbao-init
    depends_on:
      openbao:
        condition: service_healthy
    restart: "no"
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: texera-dev-root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ! bao secrets list -format=json | grep -q '"texera/"'; then
          bao secrets enable -path=texera -version=2 kv
        fi
        echo "secret mount texera ready"

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: texera2-rustfs
    # Published on the host as 127.0.0.1:19001; see lakekeeper-net for how Lakekeeper reaches the
    # same address, so one S3 endpoint works for the engine on the host and for Lakekeeper.
    environment:
      RUSTFS_ACCESS_KEY: texera
      RUSTFS_SECRET_KEY: texera-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:19001:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs-init:
    image: rustfs/rc:v0.1.35
    container_name: texera2-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rc alias set local http://rustfs:9000 texera texera-secret --region us-east-1 --bucket-lookup path
        rc bucket create --ignore-existing local/texera
        rc bucket create --ignore-existing local/datasets
        echo "buckets ready"

  # Lakekeeper authenticates every caller against Keycloak and authorizes with OpenFGA (a store
  # of its own on the same server): the catalog is its operator and hands each unit's identity
  # the namespaces of the runs it executes, so a unit reaches nothing else in the lake.
  lakekeeper-migrate:
    image: vakamo/lakekeeper:v0.11.0
    container_name: texera2-lakekeeper-migrate
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: texera2-dev-only-encryption-key
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://texera:texera@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://texera:texera@postgres:5432/lakekeeper
      LAKEKEEPER__AUTHZ_BACKEND: openfga
      LAKEKEEPER__OPENFGA__ENDPOINT: http://openfga:8081
      LAKEKEEPER__OPENID_PROVIDER_URI: http://localhost:8088/auth/realms/texera
      RUST_LOG: info
    entrypoint: ["/home/nonroot/lakekeeper"]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy
    restart: "no"

  # Lakekeeper's network namespace, with two forwards in it so that two public addresses work
  # inside the namespace exactly as they do on the host: 127.0.0.1:8088 is the gateway (Keycloak's
  # discovery document names that issuer, and Lakekeeper fetches its keys from there) and
  # 127.0.0.1:19001 is RustFS (Lakekeeper hands that endpoint to the engine on the host, so it
  # must resolve in both places; on Linux, Docker Desktop and OrbStack alike). The namespace is
  # owned by this container so Lakekeeper can restart inside it, and it publishes the ports.
  lakekeeper-net:
    image: alpine/socat:1.8.0.0
    container_name: texera2-lakekeeper-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        socat TCP4-LISTEN:8088,fork,reuseaddr,bind=127.0.0.1 TCP:envoy:8080 &
        exec socat TCP4-LISTEN:19001,fork,reuseaddr,bind=127.0.0.1 TCP:rustfs:9000
    depends_on:
      envoy:
        condition: service_started
      rustfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:18181:8181"

  lakekeeper:
    image: vakamo/lakekeeper:v0.11.0
    container_name: texera2-lakekeeper
    network_mode: "service:lakekeeper-net"
    # Lakekeeper returns its base URI to Iceberg clients; only the engine on the host uses it.
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: texera2-dev-only-encryption-key
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://texera:texera@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://texera:texera@postgres:5432/lakekeeper
      LAKEKEEPER__BASE_URI: ${TEXERA2_LAKEKEEPER_URI:-http://localhost:18181}
      LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
      LAKEKEEPER__LISTEN_PORT: "8181"
      LAKEKEEPER__AUTHZ_BACKEND: openfga
      LAKEKEEPER__OPENFGA__ENDPOINT: http://openfga:8081
      LAKEKEEPER__OPENID_PROVIDER_URI: http://localhost:8088/auth/realms/texera
      RUST_LOG: info
    entrypoint: ["/home/nonroot/lakekeeper"]
    command: ["serve"]
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-net:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20


  envoy:
    image: envoyproxy/envoy:v1.36-latest
    container_name: texera2-envoy
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:9901:9901"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_started

volumes:
  postgres-data:
  rustfs-data:
