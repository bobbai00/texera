apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.workflowComputingUnitManager.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.workflowComputingUnitManager.name }}
spec:
  replicas: {{ .Values.workflowComputingUnitManager.numOfPods }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.workflowComputingUnitManager.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.workflowComputingUnitManager.name }}
    spec:
      {{- if .Values.global.texeraMicroServiceRuntimeClass }}
      runtimeClassName: {{ .Values.global.texeraMicroServiceRuntimeClass | quote }}
      {{- end }}      
      serviceAccountName: {{ .Values.workflowComputingUnitManager.serviceAccountName }}
      initContainers:
        # /health answers without a token; every other Lakekeeper route needs one.
        - name: wait-lakekeeper
          image: curlimages/curl:8.22.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              LAKEKEEPER_BASE_URI="http://{{ .Release.Name }}-lakekeeper:{{ .Values.lakekeeper.catalog.service.externalPort }}"
              echo "Waiting for Lakekeeper to become healthy..."
              until curl -s -f "${LAKEKEEPER_BASE_URI}/health" > /dev/null 2>&1; do
                sleep 1
              done
              echo "Lakekeeper is healthy."
      containers:
        - name: {{ .Values.workflowComputingUnitManager.name }}
          image: {{ .Values.texera.imageRegistry }}/{{ .Values.workflowComputingUnitManager.imageName }}:{{ .Values.texera.imageTag }}
          imagePullPolicy: {{ .Values.texeraImages.pullPolicy }}
          ports:
            - containerPort: {{ .Values.workflowComputingUnitManager.service.port }}
          env:
            # Kubernetes related variables
            - name: KUBERNETES_COMPUTE_UNIT_POOL_NAMESPACE
              value: {{ .Values.workflowComputingUnitPool.namespace }}
            - name: KUBERNETES_COMPUTE_UNIT_SERVICE_NAME
              value: {{ .Values.workflowComputingUnitPool.name }}-svc
            - name: KUBERNETES_COMPUTE_UNIT_POD_NAME_PREFIX
              value: {{ .Values.workflowComputingUnitPool.podNamePrefix }}
            - name: TEXERA_CURATED_IMAGES_ENABLED
              value: "{{ .Values.curatedImages.enabled }}"
            # Must be the namespace the pool runs in; validation jobs go there.
            - name: TEXERA_CURATED_IMAGE_VALIDATION_NAMESPACE
              value: {{ .Values.workflowComputingUnitPool.namespace }}
            - name: TEXERA_CURATED_IMAGE_PREPULL_ENABLED
              value: "{{ .Values.curatedImages.prepull.enabled }}"
            # Not the release namespace, which holds the privileged mounter.
            - name: TEXERA_CURATED_IMAGE_PREPULL_NAMESPACE
              value: {{ .Values.workflowComputingUnitPool.namespace }}
            - name: KUBERNETES_IMAGE_NAME
              value: {{ .Values.texera.imageRegistry }}/{{ .Values.workflowComputingUnitPool.imageName }}:{{ .Values.texera.imageTag }}
            - name: KUBERNETES_MOUNTER_ENABLED
              value: "{{ .Values.mounter.enabled }}"
            {{- if .Values.mounter.enabled }}
            - name: KUBERNETES_MOUNTER_HOST_ROOT
              value: "{{ .Values.mounter.hostMountRoot }}"
            # These two are passed straight on to each computing-unit pod, which the chart
            # cannot reach itself: the pod runs in the pool namespace and is created at
            # runtime, so the address is qualified rather than a bare service name.
            - name: TEXERA_MOUNT_IN_POD_ROOT
              value: "{{ .Values.mounter.podMountRoot }}"
            - name: ACCESS_CONTROL_SERVICE_URL
              value: http://{{ .Values.accessControlService.name }}-svc.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.accessControlService.service.port }}
            {{- end }}
            # TexeraDB Access, for this service only: it passes none of it on to a computing
            # unit, which keeps nothing in Postgres.
            - name: STORAGE_JDBC_URL
              value: jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/texera_db?currentSchema=texera_db,public
            - name: STORAGE_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
            # FileService Access: passed on to each computing unit, whose Python UDFs ask it
            # for links to the dataset files they open.
            - name: FILE_SERVICE_GET_DATASET_PRESIGNED_URL_ENDPOINT
              value: http://{{ .Values.fileService.name }}-svc:9092/api/dataset/presign-download
            # S3 Access (for R UDF large binary support)
            - name: STORAGE_S3_ENDPOINT
              value: {{ include "texera.s3.endpoint" . }}
            {{- if .Values.storage.s3.endpoint }}
            - name: STORAGE_S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            {{- end }}
            - name: STORAGE_S3_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "texera.s3.secretName" . }}
                  key: {{ include "texera.s3.accessKeyIdKey" . }}
            - name: STORAGE_S3_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "texera.s3.secretName" . }}
                  key: {{ include "texera.s3.secretAccessKeyKey" . }}
            {{- if .Values.storage.s3.unitAccessKeyId }}
            # The key this service gives each unit it creates: one that reaches only the
            # large-binaries bucket.
            - name: STORAGE_S3_UNIT_AUTH_USERNAME
              value: {{ .Values.storage.s3.unitAccessKeyId | quote }}
            - name: STORAGE_S3_UNIT_AUTH_PASSWORD
              value: {{ .Values.storage.s3.unitSecretAccessKey | quote }}
            {{- end }}
            # Workflow Result
            - name: STORAGE_ICEBERG_CATALOG_TYPE
              value: rest
            - name: STORAGE_ICEBERG_CATALOG_REST_URI
              value: http://{{ .Release.Name }}-lakekeeper:{{ .Values.lakekeeper.catalog.service.externalPort }}/catalog
            - name: STORAGE_ICEBERG_CATALOG_REST_WAREHOUSE_NAME
              value: {{ .Values.lakekeeperInit.warehouse.name | quote }}
            - name: STORAGE_ICEBERG_CATALOG_REST_S3_BUCKET
              value: {{ .Values.lakekeeperInit.warehouse.s3Bucket | quote }}
            {{- range .Values.texeraEnvVars }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
            {{- include "texera.observability.env" . | nindent 12 }}