# Who may reach a computing unit. A unit verifies no token: it trusts the identity headers of
# whoever reaches it, so only these three may:
#   - the gateway's proxy, which lets a WebSocket through once the access control service has
#     checked its user, and sets the headers from that answer;
#   - the Dashboard service, which hands a unit the plan of each execution it creates and each
#     change to a paused operator;
#   - the agent service, which waits for its executions on the unit.
# Every other pod is refused, in this namespace too: one computing unit cannot reach another.
#
# kubernetes.io/metadata.name is set automatically on every namespace, so the release's namespace
# is named here without labelling anything by hand. Requires a cluster with a NetworkPolicy
# controller; without one the object is created but not enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.workflowComputingUnitPool.name }}-callers
  namespace: {{ .Values.workflowComputingUnitPool.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: {{ .Release.Name }}-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: {{ .Release.Namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: {{ .Release.Name }}-{{ .Values.webserver.name }}
        {{- if .Values.agentService.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: {{ .Release.Name }}-{{ .Values.agentService.name }}
        {{- end }}
