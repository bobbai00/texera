{{- if .Values.lakekeeperInit.createBucket }}
# Creates the bucket every Lakekeeper warehouse keeps its tables in. The Dashboard service
# registers the warehouses with Lakekeeper itself, and Lakekeeper refuses one whose bucket does
# not exist, so the Dashboard keeps trying until this job has made it. `rc` is RustFS's S3
# client; using its image keeps the client out of a general-purpose image, which would
# otherwise have to fetch a binary at runtime.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-lakekeeper-init
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 3
  template:
    metadata:
      name: {{ .Release.Name }}-lakekeeper-init
    spec:
      restartPolicy: Never
      containers:
        - name: create-bucket
          image: {{ .Values.lakekeeperInit.bucketClientImage }}
          env:
            - name: STORAGE_S3_ENDPOINT
              value: {{ include "texera.s3.endpoint" . }}
            - name: STORAGE_S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: STORAGE_S3_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "texera.s3.secretName" . }}
                  key: {{ include "texera.s3.accessKeyIdKey" . }}
            - name: STORAGE_S3_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "texera.s3.secretName" . }}
                  key: {{ include "texera.s3.secretAccessKeyKey" . }}
            - name: STORAGE_ICEBERG_CATALOG_REST_S3_BUCKET
              value: {{ .Values.lakekeeperInit.warehouse.s3Bucket | quote }}
            - name: STORAGE_S3_UNIT_AUTH_USERNAME
              value: {{ .Values.storage.s3.unitAccessKeyId | quote }}
            - name: STORAGE_S3_UNIT_AUTH_PASSWORD
              value: {{ .Values.storage.s3.unitSecretAccessKey | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for the object store at ${STORAGE_S3_ENDPOINT}..."
              until rc alias set local "${STORAGE_S3_ENDPOINT}" \
                    "${STORAGE_S3_AUTH_USERNAME}" "${STORAGE_S3_AUTH_PASSWORD}" \
                    --region "${STORAGE_S3_REGION}" \
                    --bucket-lookup path > /dev/null 2>&1; do
                sleep 3
              done

              echo "Initializing object-store bucket '${STORAGE_ICEBERG_CATALOG_REST_S3_BUCKET}'..."
              rc bucket create --ignore-existing "local/${STORAGE_ICEBERG_CATALOG_REST_S3_BUCKET}"
              echo "Bucket '${STORAGE_ICEBERG_CATALOG_REST_S3_BUCKET}' is ready."

              # The computing units' own user, which reaches only the large-binaries bucket
              # (storage.s3.large-binaries-bucket in the services' configuration): a unit reads
              # and writes the lake's tables only through the catalog. Each command leaves what
              # is there as it is, so the job may run again.
              if [ -n "${STORAGE_S3_UNIT_AUTH_USERNAME}" ]; then
                BINARIES=texera-large-binaries
                rc bucket create --ignore-existing "local/${BINARIES}"
                printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' \
                  "${BINARIES}" "${BINARIES}" > /tmp/unit-policy.json
                rc admin policy create local texera-unit-large-binaries /tmp/unit-policy.json
                rc admin user add local "${STORAGE_S3_UNIT_AUTH_USERNAME}" \
                  "${STORAGE_S3_UNIT_AUTH_PASSWORD}"
                rc admin policy attach local texera-unit-large-binaries \
                  --user "${STORAGE_S3_UNIT_AUTH_USERNAME}"
                echo "User '${STORAGE_S3_UNIT_AUTH_USERNAME}' reaches only bucket '${BINARIES}'."
              fi
{{- end }}
