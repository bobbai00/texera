{{/* The datastore, for the migration and for the server: the texera_openfga database, which
the Postgres init script makes from sql/texera_openfga.sql. */}}
{{- define "texera.openfga.datastoreEnv" -}}
- name: OPENFGA_DATASTORE_ENGINE
  value: postgres
- name: OPENFGA_DATASTORE_URI
  value: postgres://{{ .Release.Name }}-postgresql:5432/texera_openfga?sslmode=disable
- name: OPENFGA_DATASTORE_USERNAME
  value: postgres
- name: OPENFGA_DATASTORE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .Release.Name }}-postgresql
      key: postgres-password
{{- end }}

# OpenFGA, where Lakekeeper keeps who may do what in the catalog: the grants the Dashboard
# service makes on each execution's namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openfga
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-openfga
spec:
  replicas: {{ .Values.openfga.numOfPods }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-openfga
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-openfga
    spec:
      # Brings the datastore's schema up to date before the server starts, and changes nothing
      # once it is. It fails, and is run again, until Postgres answers.
      initContainers:
        - name: migrate
          image: {{ .Values.openfga.image }}
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            {{- include "texera.openfga.datastoreEnv" . | nindent 12 }}
      containers:
        - name: openfga
          image: {{ .Values.openfga.image }}
          imagePullPolicy: IfNotPresent
          args: ["run"]
          ports:
            - name: grpc
              containerPort: 8081
            - name: http
              containerPort: 8080
          env:
            {{- include "texera.openfga.datastoreEnv" . | nindent 12 }}
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
            # The catalog asks about nearly every request, and an execution's use of the
            # warehouse is answered by looking through the warehouse's namespaces: keep each
            # answer for 2 seconds. A new execution's answers are never in memory before its
            # grant, and an execution whose access ended is refused within the 2 seconds. The
            # cache of tuple reads stays off: it would hide a new grant.
            - name: OPENFGA_CHECK_QUERY_CACHE_ENABLED
              value: "true"
            - name: OPENFGA_CHECK_QUERY_CACHE_TTL
              value: "2s"
          readinessProbe:
            grpc:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            grpc:
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
