# Who may reach OpenFGA: Lakekeeper's pods alone, the catalog and its migration job. OpenFGA
# asks for no credential, and whoever reaches it can write any grant, so every other pod is
# refused: the Texera services, and the computing units, which run user code and whose egress
# is open. The pod selector without a namespace selector admits pods of this namespace only.
# Requires a cluster with a NetworkPolicy controller; without one the object is created but
# not enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-openfga-callers
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-openfga
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The labels the Lakekeeper subchart gives every pod it runs.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lakekeeper
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8080
