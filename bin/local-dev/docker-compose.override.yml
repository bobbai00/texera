# Overlay for bin/local-dev.sh on top of bin/single-node/docker-compose.yml.
# bin/single-node was designed so the texera microservices run inside the same
# compose network as the infra — postgres/lakefs/lakekeeper/litellm therefore
# don't publish their ports to the host. The local-dev flow runs the JVM and
# Node services *natively* on the host, so we expose each backend port here,
# and point the containers that call those services at the host. They reach it
# at HOST_LAN_IP, which bin/local-dev.sh detects and exports: the host's LAN IP
# is reachable both from the containers and from the host itself.

services:
  # A host-native backend (sbt / IntelliJ) emits OTLP to the collector that
  # runs inside compose, so publish the collector's receiver ports on the host
  # loopback. Only takes effect when the observability-collector profile is on.
  otel-collector:
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  postgres:
    ports:
      - "5432:5432"

  lakefs:
    ports:
      - "8000:8000"

  # When it starts, Lakekeeper reads the key it checks every catalog token with from the access
  # control service, which runs on the host here.
  lakekeeper:
    ports:
      - "8181:8181"
    environment:
      LAKEKEEPER__OPENID_PROVIDER_URI: http://${HOST_LAN_IP}:9096/api/catalog-issuer

  litellm:
    ports:
      - "4000:4000"

  # The gateway carries a computing unit's websocket: the dev server's proxy sends /wsapi to it
  # (frontend/proxy.config.json), and the access control service says who the caller is and
  # where the unit is, as in bin/single-node. envoy.yaml dials each service by its compose name,
  # and here each name is the host's address. The unit's address the access control service
  # answers is the host's too (WORKFLOW_EXECUTION_SERVICE_ENDPOINT, set by bin/local-dev.sh,
  # which also gives the gateway its own host port: texera-web holds 8080).
  gateway:
    extra_hosts:
      - "dashboard-service:${HOST_LAN_IP}"
      - "workflow-compiling-service:${HOST_LAN_IP}"
      - "file-service:${HOST_LAN_IP}"
      - "config-service:${HOST_LAN_IP}"
      - "workflow-computing-unit-managing-service:${HOST_LAN_IP}"
      - "access-control-service:${HOST_LAN_IP}"
      - "agent-service:${HOST_LAN_IP}"
      - "notebook-migration-service:${HOST_LAN_IP}"
      - "result-service:${HOST_LAN_IP}"

  # The default compose file points TEXERA_ORIGIN at the gateway's origin (:8080), but
  # the Angular dev server serves the app here, on :4200 (local-dev's gateway carries only
  # the computing unit's websocket). That origin is what Jupyter puts in its iframe CSP
  # frame-ancestors and what custom.js uses as the postMessage targetOrigin, so leaving it
  # at :8080 makes the browser refuse to render the notebook panel.
  jupyter:
    environment:
      TEXERA_ORIGIN: ${TEXERA_ORIGIN:-http://localhost:4200}
