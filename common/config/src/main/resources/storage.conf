# See PR https://github.com/Texera/texera/pull/3326 for configuration guidelines.
storage {

    # Configuration for Apache Iceberg, used for storing the workflow results & stats
    iceberg {
        catalog {
            type = rest # either hadoop, rest, or postgres
            type = ${?STORAGE_ICEBERG_CATALOG_TYPE}

            rest {
                uri = "http://localhost:8181/catalog"
                uri = ${?STORAGE_ICEBERG_CATALOG_REST_URI}

                warehouse-name = "texera"
                warehouse-name = ${?STORAGE_ICEBERG_CATALOG_REST_WAREHOUSE_NAME}

                s3-bucket = "texera-iceberg"
                s3-bucket = ${?STORAGE_ICEBERG_CATALOG_REST_S3_BUCKET}
            }

            postgres {
                # do not include scheme in the uri as Python and Java use different schemes
                uri-without-scheme = "localhost:5432/texera_iceberg_catalog"
                uri-without-scheme = ${?STORAGE_ICEBERG_CATALOG_POSTGRES_URI_WITHOUT_SCHEME}

                username = "postgres"
                username = ${?STORAGE_ICEBERG_CATALOG_POSTGRES_USERNAME}

                password = "postgres"
                password = ${?STORAGE_ICEBERG_CATALOG_POSTGRES_PASSWORD}
            }
        }

        table {
            result-namespace = "operator-port-result"
            result-namespace = ${?STORAGE_ICEBERG_TABLE_RESULT_NAMESPACE}

            console-messages-namespace = "operator-console-messages"
            console-messages-namespace = ${?STORAGE_ICEBERG_TABLE_CONSOLE_MESSAGES_NAMESPACE}

            runtime-statistics-namespace = "workflow-runtime-statistics"
            runtime-statistics-namespace = ${?STORAGE_ICEBERG_TABLE_RUNTIME_STATISTICS_NAMESPACE}

            state-namespace = "operator-port-state"
            state-namespace = ${?STORAGE_ICEBERG_TABLE_STATE_NAMESPACE}

            # One table per execution: its stored plan, the updates to its paused operators,
            # and the tag that marks it started
            plan-namespace = "execution-plan"
            plan-namespace = ${?STORAGE_ICEBERG_TABLE_PLAN_NAMESPACE}

            # One table per execution: the changes of its state, each with why, and its
            # newest state as table properties
            execution-log-namespace = "execution-log"
            execution-log-namespace = ${?STORAGE_ICEBERG_TABLE_EXECUTION_LOG_NAMESPACE}

            commit {
                batch-size = 4096 # decide the buffer size of our IcebergTableWriter
                batch-size = ${?STORAGE_ICEBERG_TABLE_COMMIT_BATCH_SIZE}

                # How often, in milliseconds, a computing unit commits the statistics and the
                # console output of an execution it runs, and marks the execution's log to show
                # that it is alive. A unit that dies loses at most this much of them.
                interval-ms = 30000
                interval-ms = ${?STORAGE_ICEBERG_TABLE_COMMIT_INTERVAL_MS}

                # retry configures the OCC parameter for concurrent write operations in Iceberg
                # Docs about Reliability in Iceberg: https://iceberg.apache.org/docs/1.7.1/reliability/
                # Docs about full parameter list and their meaning: https://iceberg.apache.org/docs/1.7.1/configuration/#write-properties
                retry {
                    num-retries = 10
                    num-retries = ${?STORAGE_ICEBERG_TABLE_COMMIT_NUM_RETRIES}

                    min-wait-ms = 100
                    min-wait-ms = ${?STORAGE_ICEBERG_TABLE_COMMIT_MIN_WAIT_MS}

                    max-wait-ms = 10000
                    max-wait-ms = ${?STORAGE_ICEBERG_TABLE_COMMIT_MAX_WAIT_MS}
                }
            }
        }
    }

    # Configurations of the LakeFS & S3 for dataset storage;
    # Default values are provided for each field, which you don't need to change them if you deployed LakeFS+S3 via docker-compose.yml in file-service/src/main/resources/docker-compose.yml
    lakefs {
        endpoint = "http://localhost:8000/api/v1"
        endpoint = ${?STORAGE_LAKEFS_ENDPOINT}

        auth {
            api-secret = "random_string_for_lakefs"
            api-secret = ${?STORAGE_LAKEFS_AUTH_API_SECRET}

            username = "AKIAIOSFOLKFSSAMPLES"
            username = ${?STORAGE_LAKEFS_AUTH_USERNAME}

            password = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
            password = ${?STORAGE_LAKEFS_AUTH_PASSWORD}
        }

        block-storage {
            type = "s3"
            type = ${?STORAGE_LAKEFS_BLOCK_STORAGE_TYPE}

            bucket-name = "texera-dataset"
            bucket-name = ${?STORAGE_LAKEFS_BLOCK_STORAGE_BUCKET_NAME}
        }
    }

    s3 {
        endpoint = "http://localhost:9000"
        endpoint = ${?STORAGE_S3_ENDPOINT}

        region = "us-west-2"
        region = ${?STORAGE_S3_REGION}

        # Bucket for large binaries; shared by the JVM and Python workers and cleanup.
        large-binaries-bucket = "texera-large-binaries"
        large-binaries-bucket = ${?STORAGE_S3_LARGE_BINARIES_BUCKET}

        multipart {
            part-size = "16MB"
            part-size = ${?STORAGE_S3_MULTIPART_PART_SIZE}
        }

        auth {
            username = "texera_rustfs"
            username = ${?STORAGE_S3_AUTH_USERNAME}

            password = "password"
            password = ${?STORAGE_S3_AUTH_PASSWORD}
        }
    }

    # The links a run reads its input files through. When the Dashboard service creates an
    # execution, the compiling service makes its plan for the user who creates it, and says in
    # it where each dataset file the workflow's scan operators read is kept, and each file its
    # File Listers list for a File Scan From Input. The Dashboard service, which holds the
    # object store's keys, signs a link to each: a presigned GET on the object store. The
    # links travel in the execution's plan to the computing unit, which reads the files through
    # them and asks no service for a file.
    input-links {
        # The object-store endpoint the Dashboard service signs the links for: the address
        # computing units reach the store at. A link works only at the address it is signed for.
        s3-endpoint = ${storage.s3.endpoint}
        s3-endpoint = ${?STORAGE_INPUT_LINKS_S3_ENDPOINT}

        # How long a link works after it is made, in seconds: at most 604800 (7 days), the
        # longest a presigned link can last, and at least 60. Nothing renews a link. An
        # execution started after its links expired is refused, and a run that opens a file
        # after its link expired (resumed from a long pause, say) fails on the operator that
        # reads it. Either way the workflow is run again, and its new execution gets new links.
        ttl-seconds = 604800
        ttl-seconds = ${?STORAGE_INPUT_LINKS_TTL_SECONDS}

        # The object-store endpoints a computing unit reads links from, separated by commas. A
        # plan's link that points anywhere else is refused, and nothing is fetched from it.
        allowed-endpoints = ${storage.s3.endpoint}
        allowed-endpoints = ${?STORAGE_INPUT_LINKS_ALLOWED_ENDPOINTS}
    }

    # Automated cleanup of uploaded but uncommitted dataset files.
    # Defaults to false because this job deletes uncommitted data: it must be turned on
    # explicitly per deployment (via STORAGE_CLEANUP_ENABLED) rather than auto-enabling in
    # every environment the moment this merges to main.
    cleanup {
        enabled = false
        enabled = ${?STORAGE_CLEANUP_ENABLED}

        # Uncommitted uploads older than this many hours are cleaned up. Keep this above the
        # 24h presigned-URL expiry (S3StorageClient.PHYSICAL_ADDRESS_EXPIRATION_TIME_HRS) so
        # that only already-non-resumable upload sessions are deleted.
        retention-hours = 72
        retention-hours = ${?STORAGE_CLEANUP_RETENTION_HOURS}

        # Delay between two consecutive cleanup rounds
        interval-minutes = 60
        interval-minutes = ${?STORAGE_CLEANUP_INTERVAL_MINUTES}
    }

    # Per-user warehouse feature (#6870). Only takes effect with the REST catalog
    # (Lakekeeper), since warehouses are Lakekeeper entities; any other catalog type
    # keeps the feature off whatever this says.
    warehouse {
        enabled = true
        enabled = ${?STORAGE_WAREHOUSE_ENABLED}
    }

    # Configuration for Postgres, used for user system data & metadata storage
    jdbc {
        url = "jdbc:postgresql://localhost:5432/texera_db?currentSchema=texera_db,public"
        url = ${?STORAGE_JDBC_URL}

        username = "postgres"
        username = ${?STORAGE_JDBC_USERNAME}

        password = "postgres"
        password = ${?STORAGE_JDBC_PASSWORD}
    }

    # The single JupyterLab used when per-user provisioning (kubernetes.jupyter-enabled)
    # is off, which is how the single-node and local-dev deployments run.
    jupyter {
        internal-url = "http://localhost:9100"
        internal-url = ${?STORAGE_JUPYTER_INTERNAL_URL}

        public-url = ${storage.jupyter.internal-url}
        public-url = ${?STORAGE_JUPYTER_PUBLIC_URL}

        # Read from the same JUPYTER_TOKEN env var as the Jupyter container
        token = "texera"
        token = ${?JUPYTER_TOKEN}

        # HMAC key each per-user Jupyter token is derived from, so no token is stored.
        # Required when per-user Jupyter is on, and must stay stable across restarts and
        # replicas or previously issued tokens stop matching.
        token-secret = ""
        token-secret = ${?JUPYTER_TOKEN_SECRET}
    }
}
