python {
    # python3 executable path
    path = ""
    path = ${?UDF_PYTHON_PATH}

    log {
        streamHandler {
            # handler output level
            level="INFO"
            level = ${?UDF_PYTHON_LOG_STREAMHANDLER_LEVEL}
        }
    }

    # The Python environments a run's plan names for its operators. A computing unit installs
    # each one the first time a run needs it, and every later run that needs it uses that install.
    environments {
        # The directory a computing unit installs environments under, one directory each. It
        # must be writable, and need not outlive the unit: an environment that is not there is
        # installed again.
        root = "/tmp/texera-python-environments"
        root = ${?UDF_PYTHON_ENVIRONMENTS_ROOT}

        # How long one install may take, in minutes. An install that takes longer is stopped, and
        # the runs waiting for it fail.
        install-timeout-minutes = 30
        install-timeout-minutes = ${?UDF_PYTHON_ENVIRONMENTS_INSTALL_TIMEOUT_MINUTES}
    }
}

r {
    # Path to your R home here (if you want to use R-UDF)
    path = ""
    path = ${?UDF_R_PATH}
}
