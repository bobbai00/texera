# See PR https://github.com/Texera/texera/pull/3326 for configuration guidelines.
constants {
    logging-queue-size-interval = 30000
    logging-queue-size-interval = ${?CONSTANTS_LOGGING_QUEUE_SIZE_INTERVAL}

    num-worker-per-operator = 2
    num-worker-per-operator = ${?CONSTANTS_NUM_WORKER_PER_OPERATOR}

    max-resolution-rows = 2000
    max-resolution-rows = ${?CONSTANTS_MAX_RESOLUTION_ROWS}

    max-resolution-columns = 2000
    max-resolution-columns = ${?CONSTANTS_MAX_RESOLUTION_COLUMNS}

    status-update-interval = 500
    status-update-interval = ${?CONSTANTS_STATUS_UPDATE_INTERVAL}

    runtime-statistics-persistence-interval = 2000
    runtime-statistics-persistence-interval = ${?CONSTANTS_RUNTIME_STATISTICS_PERSISTENCE_INTERVAL}

    # The most files of dataset versions that one operator of a plan made to run may list or
    # read: a File Lister whose version holds more, and a File Scan From Input whose upstream
    # File Listers list more between them, fail the compile. The compiling service, which makes
    # the plans of runs, reads it. A plan carries each file it lists, with a link to each file
    # read.
    #
    # Two sizes bound it, both measured at 10,000 files with links of 600 characters (an
    # object store signs links of 400 to 600):
    #  - An execution's plan is stored whole, in at most 16 MiB (ExecutionPlanStore.MaxBodyBytes).
    #    A File Lister and the File Scan From Input after it take about 927 bytes of plan for
    #    each file, so about 18,000 files fit. A larger plan is refused when its execution is
    #    created.
    #  - The engine hands each worker of a File Scan From Input every link in one message,
    #    about 708 bytes for each file, and the nodes of a computing unit pass no message above
    #    30 MiB (maximum-frame-size in cluster.conf): about 44,000 files fit. The message is
    #    part of what the plan holds, so the plan's limit is reached first.
    max-listed-files = 10000
    max-listed-files = ${?CONSTANTS_MAX_LISTED_FILES}
}

flow-control {
    max-credit-allowed-in-bytes-per-channel = 1600000000  # -1 to disable flow control
    max-credit-allowed-in-bytes-per-channel = ${?FLOW_CONTROL_MAX_CREDIT_ALLOWED_IN_BYTES_PER_CHANNEL}

    credit-poll-interval-in-ms = 200
    credit-poll-interval-in-ms = ${?FLOW_CONTROL_CREDIT_POLL_INTERVAL_IN_MS}
}

network-buffering {
    default-data-transfer-batch-size = 400
    default-data-transfer-batch-size = ${?NETWORK_BUFFERING_DEFAULT_DATA_TRANSFER_BATCH_SIZE}

    enable-adaptive-buffering = true
    enable-adaptive-buffering = ${?NETWORK_BUFFERING_ENABLE_ADAPTIVE_BUFFERING}

    adaptive-buffering-timeout-ms = 500
    adaptive-buffering-timeout-ms = ${?NETWORK_BUFFERING_ADAPTIVE_BUFFERING_TIMEOUT_MS}
}

reconfiguration {
    enable-transactional-reconfiguration = false
    enable-transactional-reconfiguration = ${?RECONFIGURATION_ENABLE_TRANSACTIONAL_RECONFIGURATION}
}

cache {
    # [false, true]
    enabled = true
    enabled = ${?CACHE_ENABLED}
}

# The results the Dashboard service's closing job expires by their age: an execution's result,
# state and console tables, its large binaries and its replay log. Its plan, its log and its
# statistics stay until the execution is deleted. Results also expire, whatever their age, once
# the execution's computing unit starts a later execution of its workflow.
result-cleanup {
    # How long after an execution ended its results are kept: a day.
    ttl-in-seconds = 86400
    ttl-in-seconds = ${?RESULT_CLEANUP_TTL_IN_SECONDS}

    # How often the job looks for results older than that: once a day.
    collection-check-interval-in-seconds = 86400
    collection-check-interval-in-seconds = ${?RESULT_CLEANUP_COLLECTION_CHECK_INTERVAL_IN_SECONDS}
}

# The Dashboard service's job that closes executions: it records how each one ended, from the
# execution's log in the lake, or what became of it when its log holds no ending.
execution-closing {
    # How often the job looks at the executions that are not closed yet.
    interval-seconds = 30
    interval-seconds = ${?EXECUTION_CLOSING_INTERVAL_SECONDS}

    # How long a run's computing unit may show no sign of life before the run is closed as
    # failed, "unit lost". Never less than four of the unit's own beats.
    lost-after-seconds = 180
    lost-after-seconds = ${?EXECUTION_CLOSING_LOST_AFTER_SECONDS}

    # How long an execution may wait for a computing unit to start it before it is closed as
    # failed, "never started".
    never-started-after-seconds = 600
    never-started-after-seconds = ${?EXECUTION_CLOSING_NEVER_STARTED_AFTER_SECONDS}

    # How long after an execution was closed without an ending in its log (its unit was lost, or
    # terminated) the job keeps reading the log, and records the ending instead once it is there:
    # a unit that was only cut off from the lake reports when it is back. Such an execution keeps
    # its results for this long at least, however short result-cleanup.ttl-in-seconds is.
    revise-verdict-for-seconds = 3600
    revise-verdict-for-seconds = ${?EXECUTION_CLOSING_REVISE_VERDICT_FOR_SECONDS}
}

web-server {
    workflow-state-cleanup-in-seconds = 30
    workflow-state-cleanup-in-seconds = ${?WEB_SERVER_WORKFLOW_STATE_CLEANUP_IN_SECONDS}

    python-console-buffer-size = 100
    python-console-buffer-size = ${?WEB_SERVER_PYTHON_CONSOLE_BUFFER_SIZE}

    console-message-max-display-length = 100
    console-message-max-display-length = ${?WEB_SERVER_CONSOLE_MESSAGE_MAX_DISPLAY_LENGTH}

    workflow-result-pulling-in-seconds = 3
    workflow-result-pulling-in-seconds = ${?WEB_SERVER_WORKFLOW_RESULT_PULLING_IN_SECONDS}

    max-workflow-websocket-request-payload-size-kb = 1024
    max-workflow-websocket-request-payload-size-kb = ${?MAX_WORKFLOW_WEBSOCKET_REQUEST_PAYLOAD_SIZE_KB}

    # Where the Dashboard service reaches the workflow compiling service, which makes the plan
    # of each execution it creates and of each change to a paused operator. The Dashboard waits
    # 5 seconds for a connection and 60 seconds for an answer.
    workflow-compiling-service-endpoint = "http://localhost:9090"
    workflow-compiling-service-endpoint = ${?WORKFLOW_COMPILING_SERVICE_ENDPOINT}
}

fault-tolerance {
    # URI for storage, empty to disable logging.
    # Use absolute path only. for local file system, $AMBER_FOLDER will be interpolated to Amber folder path.
    # e.g. use "file://$AMBER_FOLDER/logs/recovery-logs/" for local logging.
    log-storage-uri = ""
    log-storage-uri = ${?FAULT_TOLERANCE_LOG_STORAGE_URI}

    log-flush-interval-ms = 0 # immediately flush
    log-flush-interval-ms = ${?FAULT_TOLERANCE_LOG_FLUSH_INTERVAL_MS}

    log-record-max-size-in-byte = 67108864 # 64MB
    log-record-max-size-in-byte = ${?FAULT_TOLERANCE_LOG_RECORD_MAX_SIZE_IN_BYTE}

    # limit for resend buffer length, if the resend buffer
    # getting too large, the workflow aborts during recovery to avoid OOM.
    # TODO: Remove this after introducing checkpoints.
    max-supported-resend-queue-length = 10000
    max-supported-resend-queue-length = ${?FAULT_TOLERANCE_MAX_SUPPORTED_RESEND_QUEUE_LENGTH}

    delay-before-recovery = 3000
    delay-before-recovery = ${?FAULT_TOLERANCE_DELAY_BEFORE_RECOVERY}

    hdfs-storage {
        address = "0.0.0.0:9870"
        address = ${?FAULT_TOLERANCE_HDFS_STORAGE_ADDRESS}
    }
}

schedule-generator {
    max-concurrent-regions = 1
    max-concurrent-regions = ${?SCHEDULE_GENERATOR_MAX_CONCURRENT_REGIONS}

    use-global-search = false
    use-global-search = ${?SCHEDULE_GENERATOR_USE_GLOBAL_SEARCH}

    use-top-down-search = false
    use-top-down-search = ${?SCHEDULE_GENERATOR_USE_TOP_DOWN_SEARCH}

    search-timeout-milliseconds = 1000
    search-timeout-milliseconds = ${?SCHEDULE_GENERATOR_SEARCH_TIMEOUT_MILLISECONDS}
}

ai-assistant-server {
    assistant = "none"
    assistant = ${?AI_ASSISTANT_SERVER_ASSISTANT}

    # Put your Ai Service authentication key here
    ai-service-key = ""
    ai-service-key = ${?AI_ASSISTANT_SERVER_AI_SERVICE_KEY}

    # Put your Ai service url here (If you are using OpenAI, then the url should be "https://api.openai.com/v1")
    ai-service-url = ""
    ai-service-url = ${?AI_ASSISTANT_SERVER_AI_SERVICE_URL}
}
