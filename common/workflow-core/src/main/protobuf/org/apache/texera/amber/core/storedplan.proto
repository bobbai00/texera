// A physical plan saved to be run later: what the engine needs to run it, and nothing that only
// compiling it needs (an operator's schema propagation function, or a resource binding); with
// what the run needs besides the plan (where it replays from, where it writes its replay log, the
// costs an earlier run measured). Each operator says what it reads from outside the run, and
// where each of its output ports is stored. And a change to one operator of a paused run
// (StoredOperatorUpdate), saved in the same format version.
// PhysicalPlanCodec writes both and reads them back, as JSON with these field names.
//
// - A plan is always written as the same text: its operators, their files and its cost hints
//   are sorted, and its links are in an order that the plan's ports give.
// - A field at its default value is left out, as proto3 JSON leaves it out, and a reader takes a
//   field left out as its default. Every enum defined here starts with an UNSPECIFIED value that
//   no plan holds, and a oneof is always set: a reader refuses either.
// - The format takes in the messages it reuses from workflow.proto, executor.proto and
//   virtualidentity.proto. A change to a message here, or to one it reuses, comes with a new
//   formatVersion and new golden files (PhysicalPlanCodecSpec).

syntax = "proto3";

package org.apache.texera.amber.core;

import "google/protobuf/empty.proto";
import "org/apache/texera/amber/core/executor.proto";
import "org/apache/texera/amber/core/virtualidentity.proto";
import "org/apache/texera/amber/core/workflow.proto";
import "scalapb/scalapb.proto";

option (scalapb.options) = {
  scope: FILE,
  preserve_unknown_fields: false,
  no_default_values_in_constructor: false
};

message StoredPhysicalPlan {
  // The version of this format the plan is written in; a reader refuses another.
  int32 formatVersion = 1;
  WorkflowIdentity workflowId = 2;
  ExecutionIdentity executionId = 3;
  StoredWorkflowSettings settings = 4;
  // The warehouse the execution writes its results into. Absent: the shared default one.
  optional string warehouse = 5;
  // Every operator once, in the order of their ids. Each carries no workflow or execution id: a
  // reader gives it the plan's.
  repeated StoredPhysicalOp operators = 6;
  // Every link once. A port lists the links that join it in the order they have here, so the
  // links are in an order that gives each port its own; where the ports leave the order of two
  // links open, in the order of their ends.
  repeated PhysicalLink links = 7;
  // Where the run replays from. Absent: it replays nothing.
  StoredReplaySource replay = 8;
  // Where the run writes its replay log, an absolute URI. Absent: it writes none.
  optional string replayLogLocation = 9;
  // What an earlier run measured, for the scheduler's cost model. Absent: no earlier run, and a
  // region costs the number of its ports whose results are stored.
  StoredCostHints costHints = 10;
}

message StoredWorkflowSettings {
  enum ExecutionMode {
    EXECUTION_MODE_UNSPECIFIED = 0;
    PIPELINED = 1;
    MATERIALIZED = 2;
  }
  // How many tuples go out in one batch; at least 1.
  int32 dataTransferBatchSize = 1;
  ExecutionMode executionMode = 2;
  // The output ports whose results are stored, each once.
  repeated GlobalPortIdentity outputPortsNeedingStorage = 3;
}

message StoredPhysicalOp {
  // Where the operator's workers prefer to run.
  enum LocationPreference {
    LOCATION_PREFERENCE_UNSPECIFIED = 0;
    NO_PREFERENCE = 1;
    PREFER_COORDINATOR = 2;
    ROUND_ROBIN = 3;
  }
  PhysicalOpIdentity id = 1;
  OpExecInitInfo opExecInitInfo = 2;
  bool parallelizable = 3;
  LocationPreference locationPreference = 4;
  // Entry i is the requirement on input port number i, internal or not; a port past the end of
  // the list has none. A source operator's first entry is how its output is partitioned.
  repeated StoredPartitionRequirement partitionRequirement = 5;
  StoredPartitionRule outputPartitionRule = 6;
  // Each port once, in the order the operator iterates them.
  repeated StoredInputPort inputPorts = 7;
  repeated StoredOutputPort outputPorts = 8;
  bool isOneToManyOp = 9;
  bool requiresMaterializedExecution = 10;
  bool isLoopStart = 11;
  // How many workers to run. Absent: the engine's default.
  optional int32 suggestedWorkerNum = 12;
  // The datasets and models the operator's code reads, each once, as
  // "<repositoryName>:<commitHash>". The code names each by this locator, where the computing
  // unit that runs the plan puts the directory it mounts the repository at.
  repeated string repositoryMounts = 13;
  // The Python environment the operator's workers run in. Absent: the engine's own interpreter.
  StoredPythonEnvironment pythonEnvironment = 14;
  // What the operator reads from outside the run. Absent: nothing.
  OperatorInputs inputs = 15;
}

message StoredPartitionRequirement {
  oneof requirement {
    // The operator needs the input on the port partitioned this way.
    StoredPartitionInfo partition = 1;
    // The operator needs nothing of how the input on the port is partitioned.
    google.protobuf.Empty noRequirement = 2;
  }
}

message StoredPartitionInfo {
  oneof kind {
    StoredHashPartition hash = 1;
    StoredRangePartition range = 2;
    google.protobuf.Empty single = 3;
    google.protobuf.Empty oneToOne = 4;
    google.protobuf.Empty broadcast = 5;
    google.protobuf.Empty unknown = 6;
  }
}

message StoredHashPartition {
  repeated string attributeNames = 1;
}

message StoredRangePartition {
  repeated string attributeNames = 1;
  int64 rangeMin = 2;
  int64 rangeMax = 3;
}

// How the operator's output is partitioned, given how its inputs are (PartitionRule).
message StoredPartitionRule {
  oneof rule {
    google.protobuf.Empty firstInput = 1;
    google.protobuf.Empty keepKeyedInput = 2;
    StoredPartitionInfo fixed = 3;
  }
}

message StoredInputPort {
  // Its dependencies name input ports of the same operator.
  InputPort port = 1;
  StoredSchema schema = 2;
}

message StoredOutputPort {
  OutputPort port = 1;
  StoredSchema schema = 2;
  // Where the port is stored when the run stores it, for a user to view or for a later region to
  // read: the URI its result and its state hang off. A location of the plan's execution, in its
  // warehouse, that names this port. An input port that reads stored data reads the location of
  // the output port its link comes from.
  string storageLocation = 3;
}

message StoredSchema {
  repeated StoredAttribute attributes = 1;
}

message StoredAttribute {
  enum AttributeType {
    ATTRIBUTE_TYPE_UNSPECIFIED = 0;
    STRING = 1;
    INTEGER = 2;
    LONG = 3;
    DOUBLE = 4;
    BOOLEAN = 5;
    TIMESTAMP = 6;
    BINARY = 7;
    LARGE_BINARY = 8;
    ANY = 9;
  }
  string attributeName = 1;
  AttributeType attributeType = 2;
}

// A Python environment: the packages a computing unit installs, beside the engine's own, for the
// workers of the operators that run in it.
message StoredPythonEnvironment {
  // What the plan's user calls the environment, which the operator asked for it by; not blank.
  string name = 1;
  // The packages, as canonical requirement lines ("tabulate==0.9.0"): a package name in its
  // normalized form, then nothing or ==, >= or <= and a version. Sorted, each once.
  repeated string requirements = 2;
}

// An earlier execution's replay log, read up to one interaction.
message StoredReplaySource {
  // The execution that wrote the log; at least 1.
  int64 sourceExecutionId = 1;
  // Where the log is, an absolute URI.
  string logLocation = 2;
  // The id of the embedded control message the run replays up to; not blank.
  string interaction = 3;
}

// How long each logical operator took in an earlier execution of the workflow.
message StoredCostHints {
  // The execution the costs were measured in; at least 1.
  int64 sourceExecutionId = 1;
  // Each logical operator once, in the order of their ids. An operator the plan does not have
  // is no error: the workflow may have changed since.
  repeated StoredOperatorCost operators = 2;
}

message StoredOperatorCost {
  // Not empty.
  string logicalOperatorId = 1;
  // Finite, and at least 0.
  double seconds = 2;
}

// A change to one operator of a paused run, which the engine applies when the run resumes: the
// operator's new executor, and what its new code reads. Saved and read in the plan's format
// version, as its own text.
message StoredOperatorUpdate {
  // The version of this format the change is written in; a reader refuses another.
  int32 formatVersion = 1;
  // The execution whose operator changes.
  ExecutionIdentity executionId = 2;
  // Names the change among the execution's changes; not blank.
  string updateId = 3;
  // The operator that changes: one of the execution's plan.
  PhysicalOpIdentity opId = 4;
  OpExecInitInfo opExecInitInfo = 5;
  // The datasets and models the new code reads, as StoredPhysicalOp.repositoryMounts has them.
  repeated string repositoryMounts = 6;
}
