syntax = "proto3";
package org.apache.texera.amber.core;


import "scalapb/scalapb.proto";

option (scalapb.options) = {
  scope: FILE,
  preserve_unknown_fields: false
  no_default_values_in_constructor: false
};


// Part of the stored physical plan (storedplan.proto): a change here needs a new formatVersion.
message OpExecWithCode {
  string code = 1;
  string language = 2;
}

// Part of the stored physical plan (storedplan.proto): a change here needs a new formatVersion.
message OpExecWithClassName {
  string className = 1;
  string descString = 2;
}

// Part of the stored physical plan (storedplan.proto): a change here needs a new formatVersion.
message OpExecInitInfo {
  oneof sealed_value {
    OpExecWithClassName opExecWithClassName = 1;
    OpExecWithCode opExecWithCode = 2;
  }
}

// What an operator reads from outside the run, as the plan made to run it states it. The
// operator's executor is handed this beside its descriptor, and reads nothing else from outside.
// Part of the stored physical plan (storedplan.proto): a change here needs a new formatVersion.
message OperatorInputs {
  // The files the operator reads, each once, in the order of their names.
  repeated InputFile files = 1;
  // The files a File Lister outputs. Absent: the operator lists none.
  FileListing listing = 2;
  // The most columns a row of a CSV file the operator reads may have: the site's limit when the
  // plan was made; at least 1. Absent: the operator reads no CSV file.
  optional int32 csvParserMaxColumns = 3;
}

// A file an operator reads. The compile that makes a plan says where the file is kept; the
// service that holds the object store's keys then signs a link to that address and puts it in
// the address's place. So a file has its address or its link, never both, and a plan a computing
// unit runs has links only.
// Part of the stored physical plan (storedplan.proto): a change here needs a new formatVersion.
message InputFile {
  option (scalapb.message).extends = "org.apache.texera.amber.core.executor.LinkedFile";
  // The name the operator's executor knows the file by; not empty.
  string name = 1;
  // The link: where a GET reads the file from the object store. A secret, as whoever holds it
  // reads the file until it expires. Empty until the file is linked.
  string url = 2;
  // When the link stops working, in milliseconds since the epoch; after the epoch. 0 until the
  // file is linked.
  int64 expiresAtMs = 3;
  // The object that holds the file's bytes, in the store that keeps it (s3://bucket/key): what
  // the link is signed for. Empty once the file is linked.
  string physicalAddress = 4;
}

// The files of a dataset version, as the version was listed when the plan was made.
// Part of the stored physical plan (storedplan.proto): a change here needs a new formatVersion.
message FileListing {
  // Each file by its path: /dataset/ownerEmail/datasetName/versionName/file.
  repeated string files = 1;
}