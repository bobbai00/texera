        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/DatasetSpec'
        status:
          $ref: '#/components/schemas/DatasetStatus'
      description: The typed envelope, served by the kind routes.
      x-texera-kind:
        kind: dataset
        plural: datasets
        versioned: true
        content: manifest
        parent: project
    DatasetFile:
      type: object
      required:
        - path
        - size
        - sha256
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          $ref: '#/components/schemas/Digest'
        contentType:
          type: string
    DatasetPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    DatasetSpec:
      type: object
      properties:
        format:
          type: string
          description: A content hint for the files, free-form, e.g. csv or parquet.
    DatasetStatus:
      type: object
      properties:
        files:
          type: integer
          format: int32
          description: Files and bytes of the head version.
        bytes:
          type: integer
          format: int64
        staged:
          type: integer
          format: int32
          description: Files staged for the next version, not yet committed.
    DatasetVersion:
      type: object
      required:
        - rid
        - uri
        - kind
        - vno
        - contentKind
        - digest
        - content
        - createdBy
        - createdAt
      properties:
        rid:
          $ref: '#/components/schemas/Rid'
        uri:
          $ref: '#/components/schemas/Uri'
        kind:
          $ref: '#/components/schemas/ResourceKind'
        vno:
          $ref: '#/components/schemas/Vno'
        contentKind:
          $ref: '#/components/schemas/ContentKind'
        digest:
          $ref: '#/components/schemas/Digest'
        content:
          $ref: '#/components/schemas/Manifest'
        message:
          type: string
        createdBy:
          $ref: '#/components/schemas/Pid'
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/Pid'
        origin:
          $ref: '#/components/schemas/Origin'
        createdAt:
          type: string
          format: date-time
      description: A version with typed content, served by the kind routes.
    DatasetVersionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VersionSummary'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    Digest:
      type: string
      description: A SHA-256 digest, `sha256:` followed by 64 hex characters.
    Edge:
      type: object
      required:
        - from
        - relation
        - to
        - at
      properties:
        from:
          $ref: '#/components/schemas/Uri'
        relation:
          $ref: '#/components/schemas/EdgeRelation'
        to:
          $ref: '#/components/schemas/Uri'
        field:
          type: string
          description: 'For `references`: the JSON pointer into the spec that held the URI.'
        execution:
          $ref: '#/components/schemas/Rid'
          description: 'For runtime relations: the execution that caused the arrow.'
        attrs:
          type: object
          additionalProperties: {}
          description: 'For `produced`: table, snapshot, rows, bytes, hash; for `used`: the port.'
        at:
          type: string
          format: date-time
    EdgeRelation:
      type: string
      enum:
        - references
        - used
        - produced
        - derivedFrom
        - reused
      description: "The relations. `references`: a version's spec names the target. `used`: an execution read the target at a port. `produced`: an execution's port produced the target result. `derivedFrom`: a version was saved from a port result. `reused`: a port reused an earlier port's result."
    EditWorkflow:
      type: object
      properties:
        patch:
          type: array
          items:
            $ref: '#/components/schemas/JsonPatchOperation'
        spec:
          $ref: '#/components/schemas/WorkflowSpec'
        expectedHead:
          $ref: '#/components/schemas/Vno'
          description: The head version the caller saw; refused with 409 when it moved.
        message:
          type: string
          description: What changed, recorded on the new version.
        onBehalfOf:
          type: array
          items:
            $ref: '#/components/schemas/Pid'
          description: "The people whose edits this version holds, when the platform's live service saves a workflow they edited together: the first is recorded as the version's creator, all of them as its contributors. Refused from anyone else."
      description: 'An edit of a workflow: a JSON Patch over the head spec, or a full new spec.'
    EngineSpec:
      type: object
      properties:
        image:
          type: string
          description: The engine image, by tag or digest; absent means the deployment default.
    EngineStatus:
      type: object
      properties:
        digest:
          type: string
          description: The digest of the engine image that is running; operator versions are keyed by it.
        version:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
    Execution:
      type: object
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          enum:
            - catalog.texera.apache.org/v1
        kind:
          $ref: '#/components/schemas/ResourceKind'
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/ExecutionSpec'
        status:
          $ref: '#/components/schemas/ExecutionStatus'
      description: The typed envelope, served by the kind routes.
      x-texera-kind:
        kind: execution
        plural: executions
        versioned: false
        content: spec
        parent: workflow
        nested: true
        index:
          - /status/phase
          - /spec/computingUnit
    ExecutionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Execution'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    ExecutionPhase:
      type: string
      enum:
        - pending
        - provisioning
        - running
        - paused
        - completed
        - failed
        - cancelled
    ExecutionPlan:
      type: object
      required:
        - outputs
        - logicalPlan
      properties:
        namespace:
          type: string
          description: The namespace in the execution's warehouse that it writes to; absent for a dry run.
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/PortTable'
          description: 'One table per output port the engine writes, inside the namespace: the ports of operators marked viewResult and of operators nothing reads.'
        operators:
          type: array
          items:
            $ref: '#/components/schemas/Uri'
          description: The custom operator versions compiled in, with `@vno`.
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/Uri'
          description: The credentials the operators name; leased for the execution at start, their values never stored.
        logicalPlan:
          description: The engine's logical plan, with dataset files and credentials still named by URI.
      description: 'What the catalog compiled for an execution, as data: what it reads and writes, by URI. No secret and no URL that expires; those are bound when the execution starts and never stored.'
    ExecutionPort:
      type: object
      required:
        - uri
        - operatorID
        - portID
        - direction
      properties:
        uri:
          $ref: '#/components/schemas/Uri'
        operatorID:
          type: string
        portID:
          type: string
        direction:
          type: string
          enum:
            - input
            - output
        result:
          $ref: '#/components/schemas/PortSummary'
          description: 'For an output port: its result.'
        boundTo:
          $ref: '#/components/schemas/Uri'
          description: 'For an input port: the dataset file URI or the upstream port URI it read.'
      description: 'A port of an execution: an output port with its result, or an input port with its binding.'
    ExecutionSpec:
      type: object
      required:
        - workflow
        - computingUnit
        - warehouse
      properties:
        workflow:
          $ref: '#/components/schemas/Uri'
          description: The workflow version, with `@vno`.
        computingUnit:
          $ref: '#/components/schemas/Uri'
        computing:
          $ref: '#/components/schemas/ComputingRecord'
          description: 'What the unit had when it ran: the profile its node was made from, its size and packages.'
        warehouse:
          $ref: '#/components/schemas/Uri'
          description: The warehouse the execution keeps its result tables in.
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Uri'
          description: The dataset file versions the execution reads, resolved at start.
        parameters:
          type: object
          additionalProperties: {}
        plan:
          $ref: '#/components/schemas/ExecutionPlan'
          description: The compiled plan the execution was started with.
        upTo:
          type: string
          description: 'The operator the execution was run up to: only what leads to it ran, and its result was kept.'
        reused:
          type: array
          items:
            $ref: '#/components/schemas/ReusedResult'
          description: 'The results read from earlier runs: each of these operators read the rows its port had stored instead of running.'
        skipped:
          type: array
          items:
            type: string
          description: The operators that did not run because only reused results needed them.
    ExecutionStatus:
      type: object
      required:
        - phase
      properties:
        phase:
          $ref: '#/components/schemas/ExecutionPhase'
        error: {}
        operators:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OperatorRunStatus'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortSummary'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        resultsExpiredAt:
          type: string
          format: date-time
          description: "When the retention policy dropped the execution's result tables: the summaries stay, the rows are gone."
    FileLink:
      type: object
      required:
        - url
        - expiresInSeconds
      properties:
        url:
          type: string
          description: A presigned URL valid for `expiresInSeconds`.
        expiresInSeconds:
          type: integer
          format: int32
    Grant:
      type: object
      required:
        - rid
        - principal
        - relation
        - createdAt
      properties:
        rid:
          $ref: '#/components/schemas/Rid'
        principal:
          $ref: '#/components/schemas/Pid'
        relation:
          $ref: '#/components/schemas/Relation'
        createdAt:
          type: string
          format: date-time
    GrantRequest:
      type: object
      required:
        - relation
      properties:
        relation:
          $ref: '#/components/schemas/Relation'
    GraphCall:
      type: object
      required:
        - tool
        - asked
        - turn
      properties:
        tool:
          type: string
        asked:
          type: string
          description: 'What the call asked: its arguments, in short.'
        turn:
          type: string
          description: The turn it was made in.
      description: A call the chat's agent made to an outside MCP server's tool.
    GraphEdge:
      type: object
      required:
        - from
        - to
        - relation
      properties:
        from:
          $ref: '#/components/schemas/Uri'
        to:
          $ref: '#/components/schemas/Uri'
        relation:
          type: string
          enum:
            - reads
            - makes
            - uses
            - runsOn
      description: "An arrow of a chat's graph: data a workflow reads, what it makes, a model or function it uses, the unit it runs on. A workflow that has not run reads, uses and runs on what its version names and its default unit."
    GraphNode:
      type: object
      required:
        - uri
        - role
        - kind
        - name
        - made
      properties:
        uri:
          $ref: '#/components/schemas/Uri'
          description: "What the node opens: a resource's URI, or for a table a run made, its port's."
        role:
          $ref: '#/components/schemas/GraphRole'
        kind:
          $ref: '#/components/schemas/ResourceKind'
        name:
          type: string
        description:
          type: string
          description: What the resource says it is.
        version:
          $ref: '#/components/schemas/Vno'
          description: The version the chat worked from or made, the newest when there are several.
        made:
          type: boolean
          description: The chat made it, or a version of it.
        turn:
          type: string
          description: The turn of this chat that made it; absent for what the chat only worked from.
        state:
          type: string
          description: For a workflow, its last run's phase; for a unit, its phase.
        runs:
          type: array
          items:
            $ref: '#/components/schemas/GraphRun'
          description: For a workflow, its runs in the chat, newest first.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/GraphStep'
          description: For a workflow, the steps of the version its newest run ran, or of the version the chat made or worked from when it has not run, each after the steps it reads.
        step:
          type: string
          description: For a table a run made, the step that made it.
        run:
          $ref: '#/components/schemas/Uri'
          description: For a table a run made, the run.
        rows:
          type: integer
          format: int64
          description: For a table a run made, its rows.
        cpu:
          type: string
          description: For a unit, the CPU of its main node, as Kubernetes counts it; absent when it reserves none.
        memory:
          type: string
          description: For a unit, the memory of its main node, as Kubernetes counts it.
        gpu:
          type: integer
          format: int32
          description: For a unit, the GPUs of its main node.
      description: A node of a chat's graph. Nodes come in the order the chat first touched them, so a new one never comes before one already drawn.
    GraphRole:
      type: string
      enum:
        - data
        - workflow
        - model
        - function
        - unit
      description: "What a node of a chat's graph stands for: data (a dataset, or a table a run made), a workflow, a model, a function (a custom operator) or a computing unit."
    GraphRun:
      type: object
      required:
        - uri
        - phase
        - steps
        - reused
      properties:
        uri:
          $ref: '#/components/schemas/Uri'
        phase:
          type: string
        steps:
          type: integer
          format: int32
          description: The operators its plan had.
        reused:
          type: integer
          format: int32
          description: Those that read an earlier run's rows instead of running.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        unit:
          $ref: '#/components/schemas/Uri'
          description: The unit it ran on, when the caller may see it.
      description: A run of a workflow, as its node in a chat's graph lists it.
    GraphSource:
      type: object
      required:
        - uri
        - name
        - calls
      properties:
        uri:
          $ref: '#/components/schemas/Uri'
        name:
          type: string
        calls:
          type: array
          items:
            $ref: '#/components/schemas/GraphCall'
      description: An outside MCP server the chat's agent consulted, and its calls, oldest first.
    GraphStep:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: The operator's ID in the workflow; the tables it makes are named by it.
        type:
          type: string
          description: "What the step does: a built-in's type (scan, filter, join, ...), predict, or a custom operator's URI at a version."
        settings:
          type: object
          additionalProperties: {}
          description: Its settings, as the workflow version has them.
        inputs:
          type: array
          items:
            type: string
          description: The steps whose rows it reads, in port order.
      description: "A step of a workflow on a chat's graph: one operator of the version it shows."
    ImportFile:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: An https URL on the public internet. An address on a private network, the platform's own services among them, is refused, and so are a URL with a user and password in it and a redirect to plain http.
        path:
          type: string
          description: The path it is staged at; absent, the last segment of the URL's path.
      description: A file the catalog fetches itself into the staging area, from the internet.
    JsonPatchOperation:
      type: object
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
        path:
          type: string
          description: A JSON Pointer into the spec, e.g. /operators/- to append an operator or /operators/1/operatorProperties/limit.
        from:
          type: string
        value: {}
      description: One RFC 6902 JSON Patch operation.
    KeepAttachment:
      type: object
      properties:
        name:
          type: string
          description: What to call the dataset; absent, it keeps the file's name.
        description:
