          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mcp:
        tool: get_workflow
        description: Get a workflow's logical plan JSON (operators, links) at the head or a given version.
        readOnlyHint: true
  /catalog/v1/workflows/{rid}/edit:
    post:
      operationId: Workflows_edit
      description: 'Edit a workflow: a JSON Patch to the head content yields a new version.'
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Rid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceVersion'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditWorkflow'
      x-mcp:
        tool: edit_workflow
        description: Edit a workflow by applying an RFC 6902 JSON Patch to its head content (paths like /operators/- or /links/-); creates a new version and returns it. Validate afterwards with validate_workflow.
        readOnlyHint: false
        destructiveHint: false
  /catalog/v1/workflows/{rid}/executions:
    post:
      operationId: Workflows_run
      description: Run a workflow version on a computing unit; returns the execution.
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Rid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      x-mcp:
        tool: run_workflow
        description: Run a workflow version on a computing unit. Returns the execution; with waitSeconds it waits for completion and includes operator states and port results.
        readOnlyHint: false
        destructiveHint: false
        idempotentHint: false
    get:
      operationId: Workflows_listExecutions
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Rid'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: A 200 response carrying T; used where a union with Error would otherwise be ambiguous.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPage'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /catalog/v1/workflows/{rid}/validate:
    post:
      operationId: Workflows_validate
      description: 'Compile a version or draft content: output schemas per port and errors per operator.'
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Rid'
        - name: computingUnit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Rid'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileRequest'
      x-mcp:
        tool: validate_workflow
        description: "Compile a workflow version (or draft content) on a computing unit: returns each operator's output schema per port and any errors per operator."
        readOnlyHint: true
  /lineage/v1/events:
    post:
      operationId: Events_ingest
      description: OpenLineage run events posted by engines; service authentication.
      parameters: []
      responses:
