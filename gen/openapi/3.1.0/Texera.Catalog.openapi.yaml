        readOnlyHint: false
        destructiveHint: false
  /catalog/v1/workflows/{rid}:
    get:
      operationId: Workflows_read
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Rid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: Workflows_updateSpec
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Rid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
