        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineageEvent'
security:
  - BearerAuth: []
components:
  schemas:
    Agent:
      type: object
      required:
        - pid
        - template
        - lifetime
        - status
        - createdAt
      properties:
        pid:
          $ref: '#/components/schemas/Pid'
        template:
          $ref: '#/components/schemas/VersionRef'
        spawnedBy:
          $ref: '#/components/schemas/Pid'
        conversation:
          $ref: '#/components/schemas/Rid'
        execution:
          $ref: '#/components/schemas/Eid'
        opid:
          type: string
        lifetime:
          type: string
          enum:
            - execution
            - conversation
            - pinned
        status:
          type: string
          enum:
            - active
            - retired
        createdAt:
          type: string
          format: date-time
    AgentCard:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkillRef'
    AgentSkillRef:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    AgentTemplate:
      type: object
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          enum:
            - catalog.texera.apache.org/v1
        kind:
          $ref: '#/components/schemas/ResourceKind'
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/AgentTemplateSpec'
        status:
          $ref: '#/components/schemas/AgentTemplateStatus'
      description: The typed envelope, served by the kind routes.
    AgentTemplatePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentTemplate'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    AgentTemplateSpec:
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/AgentCard'
        model:
          $ref: '#/components/schemas/ModelSpec'
        prompts:
          type: object
          additionalProperties:
            type: string
          description: System prompt and objective, Markdown.
        skills:
          type: array
          items:
            type: string
          description: Skill resources, as rid or rid@vno.
        tools:
          type: object
          properties:
            mcp:
              type: array
              items:
                $ref: '#/components/schemas/McpBinding'
            operators:
              type: array
              items:
                type: string
              description: Operator types the agent may use; absent means every operator.
        loop:
          $ref: '#/components/schemas/LoopSpec'
        requires:
          $ref: '#/components/schemas/RuntimeSpec'
        subagents:
          $ref: '#/components/schemas/SubagentPolicy'
        body:
          $ref: '#/components/schemas/VersionRef'
          description: 'Composite only: the workflow whose agent operator instances form the team.'
      description: 'An agent template: card, model, prompts, skills, tools, requirements, sub-agent policy and, for a composite, the body workflow.'
    AgentTemplateStatus:
      type: object
    Attribute:
      type: object
      required:
        - attributeName
        - attributeType
      properties:
        attributeName:
          type: string
        attributeType:
          type: string
    AuthzAction:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    AuthzRequest:
      type: object
      required:
        - subject
        - action
        - resource
      properties:
        subject:
          $ref: '#/components/schemas/AuthzSubject'
        action:
          $ref: '#/components/schemas/AuthzAction'
        resource:
          $ref: '#/components/schemas/AuthzResource'
        context:
          type: object
          additionalProperties: {}
    AuthzResource:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        properties:
          type: object
          additionalProperties: {}
    AuthzResponse:
      type: object
      required:
        - decision
      properties:
        decision:
          type: boolean
        context:
          type: object
          additionalProperties: {}
    AuthzSubject:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        properties:
          type: object
          additionalProperties: {}
    CommitDataset:
      type: object
      properties:
        message:
          type: string
        origin:
          $ref: '#/components/schemas/Origin'
    CompileRequest:
      type: object
      properties:
        vno:
          $ref: '#/components/schemas/Vno'
          description: Compile this version; defaults to the head version.
        content:
          $ref: '#/components/schemas/WorkflowContent'
          description: Compile this content instead of a stored version (unsaved drafts).
    CompileResult:
      type: object
      required:
        - ok
        - operatorOutputSchemas
        - operatorErrors
      properties:
        ok:
          type: boolean
        operatorOutputSchemas:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Attribute'
                - type: 'null'
          description: Output schemas per operator id and output port id.
        operatorErrors:
          type: object
          additionalProperties: {}
          description: Errors per operator id.
        physicalPlan: {}
    ComputingUnit:
      type: object
      required:
