          items:
            $ref: '#/components/schemas/Pid'
        origin:
          $ref: '#/components/schemas/Origin'
        createdAt:
          type: string
          format: date-time
      description: A version with typed content, served by the kind routes.
    WorkflowVersionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VersionSummary'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
