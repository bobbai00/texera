        vno:
          $ref: '#/components/schemas/Vno'
          description: Compile this version; defaults to the head version.
        spec:
          $ref: '#/components/schemas/WorkflowSpec'
          description: Compile this draft spec instead of a stored version.
        computingUnit:
          $ref: '#/components/schemas/Uri'
          description: The unit whose compiler answers; defaults to the one an execution would resolve to.
    Version:
      type: object
      required:
