          $ref: '#/components/schemas/Branding'
        auth:
          $ref: '#/components/schemas/AuthSettings'
      description: "What the app needs before anyone has signed in: Texera's look and how to sign in."
    PythonOperator:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: "The operator's Python: a module whose function under `@returns(...)` is the operator, with the helpers and imports it needs. Never a class: the classes that run a function are the engine's, and the catalog refuses code that defines none under @returns."
        function:
          type: string
          description: The function in code that is the operator, `def cgm_metrics(readings, *, tir_low=70)` under `@returns(...)`; absent, the code's one function under @returns. Its positional parameters are its inputs, one table each, and a function with none is a source; its parameters with defaults are its settings, one typed `Credential` naming a credential whose secret it gets; its docstring is its description, and @returns its output columns. It returns a DataFrame, or yields DataFrames as it makes them. The catalog reads all this from the code when the operator is saved, into inputPorts, propertiesSchema and outputColumns.
        outputColumns:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
          description: Every output column, in order, read from the function's @returns.
        nondeterministic:
          type: boolean
          description: 'For a function, read from `@returns(..., nondeterministic=True)`: it may give other rows for the same input, as a function that samples without a seed, reads the clock or calls out does. No run reuses its rows, nor those of anything after it.'
    Relation:
      type: string
      enum:
        - owner
        - editor
        - viewer
        - user
      description: 'The grantable relations. On a project, an `owner` is one of its admins, who change the project itself (its settings, what it inherits from, its people), and an `editor` is a member, who works in it. `user` may use without reading: run on a computing unit, keep results in a warehouse, lease a credential.'
