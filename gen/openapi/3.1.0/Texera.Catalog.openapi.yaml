    View:
      type: string
      enum:
        - summary
        - full
      description: 'How much of a heavy spec a list carries: `summary` leaves out the large fields, `full` keeps them.'
    Visibility:
      type: string
      enum:
        - private
        - public
    Vno:
      type: integer
      format: int32
      description: Version number within a resource, starting at 1.
    Warehouse:
      type: object
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          enum:
            - catalog.texera.apache.org/v1
        kind:
          $ref: '#/components/schemas/ResourceKind'
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/WarehouseSpec'
        status:
          $ref: '#/components/schemas/WarehouseStatus'
      description: The typed envelope, served by the kind routes.
      x-texera-kind:
        kind: warehouse
        plural: warehouses
        versioned: false
        content: spec
        parent: project
    WarehousePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Warehouse'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    WarehouseSpec:
      type: object
      properties:
        storage:
          $ref: '#/components/schemas/WarehouseStorage'
          description: "A store of the owner's to keep the tables in. Absent: a place of its own on the deployment's store."
    WarehouseStatus:
      type: object
      properties:
        name:
          type: string
          description: "The warehouse's name in the lake: what an Iceberg client passes as `warehouse`."
    WarehouseStorage:
      type: object
      required:
        - endpoint
        - region
        - bucket
        - credential
      properties:
        endpoint:
          type: string
          description: The store's endpoint, as the lake and the computing units reach it. It is the deployment's own store or one the limits of the warehouse's project allow (`limits.warehouseEndpoints`, on every list set up its chain).
        region:
          type: string
        bucket:
          type: string
        keyPrefix:
          type: string
          description: 'A path in the bucket that only this warehouse uses; absent: the whole bucket.'
        credential:
          $ref: '#/components/schemas/Uri'
          description: 'The credential the lake uses for the bucket; its secret holds `accessKeyId` and `secretAccessKey`. No computing unit ever gets it: the lake hands a unit short-lived access to the tables it may touch.'
      description: "A place in an S3-compatible object store that is the warehouse's alone. The store must hand out short-lived keys itself (STS, as MinIO and RustFS do): that is how a unit reaches one table's files."
    WorkMode:
      type: string
      enum:
        - auto
        - manual
      description: "How the agent's changes go: `auto`, it makes them once it has started work; `manual`, each one waits for a person's approval."
    WorkModeSetting:
      type: object
      required:
        - mode
        - from
      properties:
        mode:
          $ref: '#/components/schemas/WorkMode'
        from:
          $ref: '#/components/schemas/SettingSource'
        project:
          $ref: '#/components/schemas/ChatProject'
          description: The project whose default it is, when it comes from a project.
      description: "How the agent's changes go in a chat: the chat's choice, else the nearest project's up the chain, else `auto`."
    Workflow:
      type: object
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          enum:
            - catalog.texera.apache.org/v1
        kind:
          $ref: '#/components/schemas/ResourceKind'
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/WorkflowSpec'
        status:
          $ref: '#/components/schemas/WorkflowStatus'
      description: The typed envelope, served by the kind routes.
      x-texera-kind:
        kind: workflow
        plural: workflows
        versioned: true
        content: spec
        parent: project
    WorkflowLink:
      type: object
      required:
        - linkID
        - source
        - target
      properties:
        linkID:
          type: string
        source:
          $ref: '#/components/schemas/WorkflowLinkEnd'
        target:
          $ref: '#/components/schemas/WorkflowLinkEnd'
      description: A link from one operator's output port to another's input port.
    WorkflowLinkEnd:
      type: object
      required:
        - operatorID
        - portID
      properties:
        operatorID:
          type: string
        portID:
          type: string
    WorkflowOperator:
      type: object
      required:
        - operatorID
        - operatorType
        - operatorProperties
      properties:
        operatorID:
          type: string
          description: Unique within the workflow, e.g. scan or avg.
        operatorType:
          type: string
          description: One of the engine's operator types, e.g. CSVFileScan, which the workflow's project or one up its chain offers, or the URI of a custom operator with `@vno`.
        operatorProperties:
          type: object
          additionalProperties: {}
          description: Property values following the operator type's JSON Schema. A file property takes a dataset file URI, texera://datasets/{rid}@{vno}/files/{path}.
        inputPorts:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPort'
          description: Defaults to one input port input-0 (none for sources).
        outputPorts:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPort'
          description: Defaults to one output port output-0.
        viewResult:
          type: boolean
          description: Store this operator's output so it can be read after the execution.
        markedForReuse:
          type: boolean
        isDisabled:
          type: boolean
        customDisplayName:
          type: string
      description: An operator instance in a workflow.
    WorkflowPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    WorkflowPort:
      type: object
      required:
        - portID
      properties:
        portID:
          type: string
          description: input-<n> or output-<n>.
        displayName:
          type: string
        allowMultiInputs:
          type: boolean
        isDynamicPort:
          type: boolean
      description: A port of an operator in a workflow.
    WorkflowSpec:
      type: object
      required:
        - operators
        - links
      properties:
        operators:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowOperator'
        links:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowLink'
        layout:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CanvasPoint'
          description: "Where each operator's card sits on the canvas, by operator. It is the app's: nothing that runs the workflow reads it, a move alone makes no version, a version keeps the places it was made with, and an operator with no place is placed beside what it connects to. A spec written without it keeps the places of the operators it kept."
        defaultComputingUnit:
          $ref: '#/components/schemas/Uri'
          description: The computing unit an execution uses when the request names none.
        defaultWarehouse:
          $ref: '#/components/schemas/Uri'
          description: The warehouse an execution keeps its results in when the request names none.
    WorkflowStatus:
      type: object
      properties:
        lastExecution:
          $ref: '#/components/schemas/Rid'
        executions:
          type: integer
          format: int64
    WorkflowValidation:
      type: object
      required:
        - ok
        - operatorOutputSchemas
        - operatorErrors
      properties:
        ok:
          type: boolean
        operatorOutputSchemas:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Attribute'
                - type: 'null'
          description: Output schemas per operator id and output port id.
        operatorErrors:
          type: object
          additionalProperties: {}
          description: Errors per operator id.
        physicalPlan: {}
        plan:
          $ref: '#/components/schemas/ExecutionPlan'
      description: "A dry run: the engine's compile result and the plan the catalog would start an execution with."
    WorkflowVersion:
      type: object
      required:
        - rid
        - uri
        - kind
        - vno
        - contentKind
        - digest
        - content
        - createdBy
        - createdAt
      properties:
