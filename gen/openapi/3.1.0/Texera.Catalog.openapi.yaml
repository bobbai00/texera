          description: What the credential is for, free text, e.g. the provider or host.
    CredentialStatus:
      type: object
      required:
        - hasSecret
      properties:
        hasSecret:
          type: boolean
        rotatedAt:
          type: string
          format: date-time
        secretPath:
          type: string
          description: Where the value lives in the secret store; set by the platform, never a value.
    Dataset:
      type: object
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
