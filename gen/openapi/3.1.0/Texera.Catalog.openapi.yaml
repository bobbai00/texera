        rid:
          $ref: '#/components/schemas/Rid'
        uri:
          $ref: '#/components/schemas/Uri'
          description: The resource URI with `@vno`.
        kind:
          $ref: '#/components/schemas/ResourceKind'
        vno:
          $ref: '#/components/schemas/Vno'
        contentKind:
          $ref: '#/components/schemas/ContentKind'
        digest:
          $ref: '#/components/schemas/Digest'
          description: SHA-256 of the canonical JSON of the content.
        content: {}
        message:
          type: string
        createdBy:
          $ref: '#/components/schemas/Pid'
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/Pid'
          description: Everyone whose edits the version holds, when more than one person made it together in a live session.
        origin:
          $ref: '#/components/schemas/Origin'
        createdAt:
          type: string
          format: date-time
      description: An immutable version of a resource.
    VersionSummary:
      type: object
      required:
