          $ref: '#/components/schemas/WorkMode'
          description: "How the agent's changes go in a chat that does not choose: `auto` or `manual`; set nowhere up the chain: `auto`."
      description: "What the project's work runs with when nothing nearer chooses: a request, a workflow and a chat choose first. A value here wins over the one the project inherits."
    ProjectLimits:
      type: object
      properties:
        results:
          type: string
          format: duration
          description: 'How long a finished execution keeps its result tables, as an ISO 8601 duration (`P30D`, `PT12H`); its record and summaries stay. The shortest along the chain holds; set nowhere: forever.'
        warehouseEndpoints:
          type: array
          items:
            type: string
          description: "The object stores, by endpoint, a warehouse in the project may be kept on besides the deployment's own store. A list narrows what the project inherits: a store must be on Texera's list, which allows none when it is not set, and on every list set along the chain."
