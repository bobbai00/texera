      description: The typed envelope, served by the kind routes.
    WorkflowContent:
      type: object
      required:
        - operators
        - links
      properties:
        operators:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowOperator'
        links:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowLink'
      description: "A workflow version's content: a dataflow graph."
    WorkflowLink:
      type: object
      required:
        - linkID
        - source
        - target
      properties:
        linkID:
          type: string
        source:
          $ref: '#/components/schemas/WorkflowLinkEnd'
        target:
          $ref: '#/components/schemas/WorkflowLinkEnd'
      description: A link from one operator's output port to another's input port.
    WorkflowLinkEnd:
      type: object
      required:
        - operatorID
        - portID
      properties:
        operatorID:
          type: string
        portID:
          type: string
    WorkflowOperator:
      type: object
      required:
        - operatorID
        - operatorType
        - operatorProperties
      properties:
        operatorID:
          type: string
          description: Unique within the workflow, e.g. scan or avg.
        operatorType:
          type: string
          description: An operatorType from the operator registry (list_operators), e.g. CSVFileScan.
        operatorVersion:
          type: string
        operatorProperties:
          type: object
          additionalProperties: {}
          description: Property values following the operator type's JSON Schema. A file property takes a dataset URI dataset://<rid>@<vno>/<path>.
        inputPorts:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPort'
          description: Defaults to one input port input-0 (none for sources).
        outputPorts:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPort'
          description: Defaults to one output port output-0.
        viewResult:
          type: boolean
          description: Store this operator's output so it can be read with get_port_result.
        markedForReuse:
          type: boolean
        isDisabled:
          type: boolean
        customDisplayName:
          type: string
      description: An operator instance in a workflow.
    WorkflowPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    WorkflowPort:
      type: object
      required:
        - portID
      properties:
        portID:
          type: string
          description: input-<n> or output-<n>.
        displayName:
          type: string
        allowMultiInputs:
          type: boolean
        isDynamicPort:
          type: boolean
      description: A port of an operator in a workflow.
    WorkflowSpec:
      type: object
      properties:
        defaultEnvironment:
          $ref: '#/components/schemas/Rid'
        defaultComputingUnit:
          $ref: '#/components/schemas/Rid'
      description: A workflow's content lives in its versions (the logical plan JSON); the spec holds only pinned defaults.
    WorkflowStatus:
      type: object
      properties:
        lastExecution:
          $ref: '#/components/schemas/Eid'
    WorkflowWithVersion:
      type: object
      required:
        - workflow
        - version
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'
        version:
          $ref: '#/components/schemas/ResourceVersion'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: http://localhost:8080
    description: the gateway
    variables: {}
