  /catalog/v1/workflows/{rid}/content:
    get:
      operationId: Workflows_content
      description: The head version's content, or a given version.
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Rid'
        - name: vno
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Vno'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceVersion'
