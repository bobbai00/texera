# The gateway of the test stack: the routes of bin/single-node/nginx.conf, plus the
# React app at /alpha/, so both apps share one origin and so one sign-in.
#
# Upstreams are variables resolved per request through Docker's DNS, so nginx starts
# when only some services run (a missing one answers 502). The stock file names its
# upstreams statically, and nginx refuses to start when one of them does not resolve.

events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        set $dashboard   http://dashboard-service:8080;
        set $file        http://file-service:9092;
        set $config      http://config-service:9094;
        set $compiling   http://workflow-compiling-service:9090;
        set $coordinator http://workflow-runtime-coordinator-service:8085;
        set $cu          http://workflow-computing-unit-managing-service:8888;
        set $acs         http://access-control-service:9096;
        set $agent       http://agent-service:3001;
        set $notebook    http://notebook-migration-service:9098;
        set $editing     http://shared-editing-service:1235;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        location /api/compile            { proxy_pass $compiling; }
        location /api/workflow-to-python { proxy_pass $compiling; }

        location /api/dataset {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass $file;
        }
        location /api/access/dataset/ { proxy_pass $file; }
        location /api/model/ {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass $file;
        }
        location /api/access/model/ { proxy_pass $file; }

        location /api/config                 { proxy_pass $config; }
        location /api/computing-unit         { proxy_pass $cu; }
        location /api/access/computing-unit/ { proxy_pass $cu; }
        location = /api/models               { proxy_pass $acs; }
        location /api/chat/                  { proxy_pass $acs; }

        location /api/agents {
            proxy_pass $agent;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }

        location /api/notebook-migration/ { proxy_pass $notebook; }
        location /api/pve/                { proxy_pass $coordinator; }
        location /api/                    { proxy_pass $dashboard; }

        location /wsapi/ {
            proxy_pass $coordinator;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # The rooms in which the React app's editor edits workflows together.
        location /shared-editing {
            proxy_pass $editing;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1d;
        }

        # The React app, built with Vite base "/alpha/".
        location = /alpha { return 301 /alpha/; }
        location /alpha/ {
            alias /srv/frontend-react/dist/;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /alpha/index.html;
        }
        # Hashed build output: a missing file is a 404, not the app's index.html.
        location /alpha/assets/ {
            alias /srv/frontend-react/dist/assets/;
            try_files $uri =404;
        }

        # The Angular app: the Dashboard Service serves frontend/dist from its image.
        location / { proxy_pass $dashboard; }
    }
}
