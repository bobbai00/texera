name: Build

# Texera 2.0: the API contract and the code generated from it, the Go catalog, the TypeScript
# agent runtime and frontend, and the engine (Scala, with its Python worker). Every job runs on
# every call; required-checks.yml is the merge gate.
#
# The end-to-end checks need the whole dev stack and a model key, so they run where those are:
# bin/texera-2-0/up.sh, then bin/texera-2-0/test.sh e2e.
#
# Go and Bun come from the runner image: Go fetches the toolchain catalog/go.mod names, and Bun is
# installed at the version package.json pins, so no third-party setup action is needed.

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""
      mode:
        # PR (default) | nightly | release. Only "PR" passes --ignore-transitive-version to
        # check_binary_deps.py.
        required: false
        type: string
        default: PR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract and generated code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install Bun and the workspaces
        run: |
          npm install -g "bun@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          bun install --frozen-lockfile
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2
      - name: Regenerate from the contract and check nothing drifted
        run: make check-drift

  catalog:
    name: Catalog (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: texera
          POSTGRES_PASSWORD: texera
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U texera"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEXERA_TEST_DATABASE_URL: postgres://texera:texera@localhost:5432/catalog_test?sslmode=disable
      # A missing database fails the suite instead of skipping it.
      TEXERA_TEST_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: catalog
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -p 1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./catalog/coverage.out
          flags: catalog
          fail_ci_if_error: false

  typescript:
    name: Agent runtime and frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install Bun and the workspaces
        run: |
          npm install -g "bun@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          bun install --frozen-lockfile
      - name: Agent runtime
        working-directory: agent-runtime
        run: bun run typecheck && bun run lint && bun test --coverage --coverage-reporter=lcov
      - name: Frontend
        working-directory: frontend-next
        run: bun run typecheck && bun run lint && bun run test && bunx vite build
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./agent-runtime/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false

  engine:
    name: Engine (Scala)
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      # Result storage for the tests: the Iceberg JDBC catalog on the service below.
      STORAGE_ICEBERG_CATALOG_TYPE: postgres
      STORAGE_ICEBERG_CATALOG_POSTGRES_URI_WITHOUT_SCHEME: localhost:5432/texera_iceberg_catalog
      STORAGE_ICEBERG_CATALOG_POSTGRES_USERNAME: texera
      STORAGE_ICEBERG_CATALOG_POSTGRES_PASSWORD: texera
      # Integration-tagged suites need the Python operator stack; they run with test.sh locally.
      AMBER_TEST_FILTER: skip-integration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: texera
          POSTGRES_PASSWORD: texera
          POSTGRES_DB: texera_iceberg_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U texera"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
        with:
          extraSbtFiles: '["*.sbt", "project/**.{scala,sbt}", "project/build.properties" ]'
      - name: Format and lint
        run: sbt scalafmtCheckAll "scalafixAll --check"
      - name: Test with coverage
        # `jacoco` runs each module's tests under the JaCoCo agent and writes its jacoco.xml.
        run: sbt jacoco
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./amber/target/scala-2.13/jacoco/report/jacoco.xml,./common/workflow-core/target/scala-2.13/jacoco/report/jacoco.xml,./common/workflow-operator/target/scala-2.13/jacoco/report/jacoco.xml,./common/workflow-compiler/target/scala-2.13/jacoco/report/jacoco.xml
          flags: engine
          fail_ci_if_error: false
      - name: Build the computing unit and check its binary LICENSE and NOTICE
        run: |
          set -euo pipefail
          sbt WorkflowExecutionService/dist
          mkdir -p /tmp/dists
          unzip -q amber/target/universal/amber-*.zip -d /tmp/dists/
          check_exit=0
          ./bin/licensing/check_binary_deps.py ${{ inputs.mode == 'PR' && '--ignore-transitive-version' || '' }} jar \
            --license-binary amber/LICENSE-binary-java \
            /tmp/dists/amber-*/lib || check_exit=$?
          ./bin/licensing/generate_notice_binary.py /tmp/notice-amber.txt /tmp/dists/amber-*/lib --extras amber/NOTICE-binary-python
          if ! diff -u amber/NOTICE-binary /tmp/notice-amber.txt; then
            echo "::error::amber/NOTICE-binary differs from generator output. Regenerate with bin/licensing/generate_notice_binary.py and commit."
            check_exit=1
          fi
          exit "$check_exit"

  python-worker:
    name: Engine Python worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: texera
          POSTGRES_PASSWORD: texera
          POSTGRES_DB: texera_iceberg_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U texera"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      STORAGE_ICEBERG_CATALOG_TYPE: postgres
      STORAGE_ICEBERG_CATALOG_POSTGRES_URI_WITHOUT_SCHEME: localhost:5432/texera_iceberg_catalog
      STORAGE_ICEBERG_CATALOG_POSTGRES_USERNAME: texera
      STORAGE_ICEBERG_CATALOG_POSTGRES_PASSWORD: texera
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-licenses uv
          uv pip install --system -r amber/requirements.txt -r amber/operator-requirements.txt -r amber/dev-requirements.txt
      - name: Check installed Python packages against the LICENSE-binary files
        run: |
          pip-licenses --format=csv --ignore-packages pip-licenses prettytable wcwidth > /tmp/pip-licenses.csv
          ./bin/licensing/check_binary_deps.py ${{ inputs.mode == 'PR' && '--ignore-transitive-version' || '' }} python /tmp/pip-licenses.csv
      - name: Lint
        working-directory: amber
        run: ruff check src/main/python src/test/python && ruff format --check src/main/python src/test/python
      - name: Install protoc
        run: |
          PROTOC_VERSION=$(cat bin/protoc-version.txt)
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc
          sudo chmod -R a+rX /usr/local/include/google
      - name: Generate Python proto bindings
        run: bash bin/python-proto-gen.sh
      - name: Test
        working-directory: amber
        env:
          LOGURU_LEVEL: ${{ runner.debug == '1' && 'DEBUG' || 'WARNING' }}
        run: pytest -m "not integration" --cov=src/main/python --cov-report=xml -sv
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./amber/coverage.xml
          flags: python-worker
          fail_ci_if_error: false
