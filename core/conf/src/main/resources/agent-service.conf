# Agent Service Configuration

agent {
  # Enable/disable agent service
  enabled = true
  enabled = ${?AGENT_ENABLED}

  # LLM Provider configurations
  providers {
    openai {
      apiKey = ""
      apiKey = ${?OPENAI_API_KEY}
      baseUrl = "https://api.openai.com/v1"
      baseUrl = ${?OPENAI_BASE_URL}
    }

    anthropic {
      apiKey = ""
      apiKey = ${?ANTHROPIC_API_KEY}
      baseUrl = "https://api.anthropic.com/v1"
      baseUrl = ${?ANTHROPIC_BASE_URL}
    }

    azure {
      apiKey = ""
      apiKey = ${?AZURE_API_KEY}
      baseUrl = ""
      baseUrl = ${?AZURE_BASE_URL}
      deployment = ""
      deployment = ${?AZURE_DEPLOYMENT}
    }
  }

  # Default model configuration
  defaultModel {
    provider = "openai"
    provider = ${?AGENT_DEFAULT_PROVIDER}
    model = "gpt-4-turbo-preview"
    model = ${?AGENT_DEFAULT_MODEL}
    temperature = 0.7
    temperature = ${?AGENT_DEFAULT_TEMPERATURE}
    maxTokens = 4096
    maxTokens = ${?AGENT_DEFAULT_MAX_TOKENS}
  }

  # Rate limiting
  rateLimit {
    requestsPerMinute = 60
    requestsPerMinute = ${?AGENT_RATE_LIMIT_RPM}
    tokensPerMinute = 100000
    tokensPerMinute = ${?AGENT_RATE_LIMIT_TPM}
  }

  # WebSocket configuration for shared editing
  sharedEditing {
    url = "ws://localhost:1234"
    url = ${?SHARED_EDITING_URL}
    reconnectInterval = 5000
    reconnectInterval = ${?SHARED_EDITING_RECONNECT_INTERVAL}
    maxReconnectAttempts = 5
    maxReconnectAttempts = ${?SHARED_EDITING_MAX_RECONNECT}
  }

  # Agent capabilities
  capabilities {
    workflowEditing = true
    workflowEditing = ${?AGENT_CAP_WORKFLOW_EDITING}
    executionControl = true
    executionControl = ${?AGENT_CAP_EXECUTION_CONTROL}
    resultViewing = true
    resultViewing = ${?AGENT_CAP_RESULT_VIEWING}
    suggestionMode = true
    suggestionMode = ${?AGENT_CAP_SUGGESTION_MODE}
  }

  # Security settings
  security {
    # Maximum workflow size agent can handle
    maxWorkflowSize = 1000
    maxWorkflowSize = ${?AGENT_MAX_WORKFLOW_SIZE}

    # Timeout for agent operations (in seconds)
    operationTimeout = 30
    operationTimeout = ${?AGENT_OPERATION_TIMEOUT}

    # Enable audit logging
    auditLogging = true
    auditLogging = ${?AGENT_AUDIT_LOGGING}
  }

  # Prompt templates
  prompts {
    systemPrompt = """You are an AI assistant helping users build and edit data workflows in Texera.
                     |You have access to tools for adding/removing operators, creating links, and modifying properties.
                     |Always use the provided tools to make changes to the workflow.
                     |Be helpful, concise, and accurate in your responses."""
    systemPrompt = ${?AGENT_SYSTEM_PROMPT}
  }
}