[project]
name = "texera"
version = "0.1.0"
description = "Apache Texera - Collaborative Data Science Platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # === Agent / LLM ===
    "smolagents[openai]==1.23.0",
    "litellm[proxy]",
    "gradio==5.50.0",
    "transformers==4.53.0",

    # === Core Data Science ===
    "numpy==1.26.4",
    "pandas==2.2.2",
    "openpyxl==3.1.5",
    "lxml==5.3.0",
    "beautifulsoup4==4.12.3",
    "geopandas==1.0.1",
    "cdflib==1.3.1",
    "pyarrow==21.0.0",
    "scikit-learn==1.5.0",
    "torch==2.8.0",

    # === Visualization ===
    "plotly==5.24.1",
    "wordcloud==1.9.3",
    "pillow==10.2.0",

    # === Database / Storage ===
    "SQLAlchemy==2.0.37",
    "pg8000==1.31.2",
    "pyiceberg==0.8.1",

    # === Utilities ===
    "loguru==0.7.0",
    "python-dateutil==2.8.2",
    "typing_extensions>=4.11.0",
    "tenacity==8.5.0",
    "overrides==7.4.0",
    "Deprecated==1.2.14",
    "bidict==0.22.0",
    "cached_property==1.5.2",
    "readerwriterlock==1.0.9",
    "psutil==5.9.0",
    "tzlocal==2.1",
    "fs==2.4.16",
    "pampy==0.3.0",
    "pybase64==1.3.2",

    # === Serialization / Protocol ===
    "protobuf==3.20.3",
    "betterproto==2.0.0b7",

    # === External APIs ===
    "praw==7.6.1",

    # === Profiling ===
    "ydata-profiling==4.17.0",
    "pympler==1.1",

    # === LSP Server ===
    "python-lsp-server[all]==1.12.0",
]

[project.optional-dependencies]
dev = [
    "wheel==0.41.2",
    "pytest==7.4.0",
    "pytest-timeout==2.2.0",
    "pytest-reraise==2.1.2",
    "iniconfig==1.1.1",
    "flake8==7.1.1",
    "Flake8-pyproject==1.2.3",
    "black==24.3.0",
]

[tool.setuptools]
packages = []

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.black]
line-length = 120
target-version = ["py312"]
