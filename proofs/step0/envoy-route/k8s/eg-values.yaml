# Values for the Envoy Gateway controller (oci://docker.io/envoyproxy/gateway-helm v1.6.3),
# the same extension switches Texera's chart sets under `envoy-gateway:` in bin/k8s/values.yaml.
# The Backend API (needed for a DynamicResolver backend) is off unless enabled here.
config:
  envoyGateway:
    extensionApis:
      enableBackend: true
      enableEnvoyPatchPolicy: true
