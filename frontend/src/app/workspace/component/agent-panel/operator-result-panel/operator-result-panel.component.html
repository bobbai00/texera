<div class="result-panel" *ngIf="summary">
  <!-- Header -->
  <div class="panel-header">
    <span class="panel-title">{{ operatorId }}</span>
  </div>

  <!-- State -->
  <div class="panel-row">
    <span class="label">State</span>
    <span class="value" [style.color]="stateColor">{{ summary.state }}</span>
  </div>

  <!-- Input shape per port -->
  <div class="panel-section" *ngIf="inputPortShapeLabels.length > 0">
    <span class="section-title">Input</span>
    <div class="panel-row" *ngFor="let port of inputPortShapeLabels">
      <span class="label">Port {{ port.portIndex }}</span>
      <span class="value">{{ port.label }}</span>
    </div>
  </div>
  <div class="panel-row" *ngIf="inputPortShapeLabels.length === 0">
    <span class="label">Input</span>
    <span class="value">{{ summary.inputTuples }} tuples</span>
  </div>

  <!-- Output shape -->
  <div class="panel-section">
    <span class="section-title">Output</span>
    <div class="panel-row">
      <span class="label">Shape</span>
      <span class="value">{{ outputShape }}</span>
    </div>
    <div class="panel-row" *ngIf="totalRowCount !== undefined && totalRowCount !== summary.outputTuples">
      <span class="label">Total rows</span>
      <span class="value">{{ totalRowCount }}</span>
    </div>
  </div>

  <!-- Console logs -->
  <div class="panel-row" *ngIf="summary.consoleLogCount">
    <span class="label">Console logs</span>
    <span class="value">{{ summary.consoleLogCount }}</span>
  </div>

  <!-- Error -->
  <div class="panel-error" *ngIf="hasError">
    <i nz-icon nzType="close-circle" nzTheme="fill" style="color: #ff4d4f; margin-right: 4px"></i>
    <span>{{ summary.error }}</span>
  </div>

  <!-- Warnings -->
  <div class="panel-warning" *ngIf="hasWarnings">
    <div *ngFor="let w of summary.warnings">
      <i nz-icon nzType="warning" nzTheme="fill" style="color: #faad14; margin-right: 4px"></i>
      <span>{{ w }}</span>
    </div>
  </div>
</div>
