<div class="model-panel">
  <div class="model-panel-content">
    <div
      *ngIf="bigObjects.length === 0"
      class="empty-state">
      <nz-empty
        nzNotFoundContent="No big objects in this workflow"
        [nzNotFoundImage]="'simple'">
      </nz-empty>
    </div>

    <div
      *ngIf="bigObjects.length > 0"
      class="objects-list">
      <nz-card
        *ngFor="let object of bigObjects"
        [nzTitle]="object.name"
        [nzSize]="'small'"
        class="object-card ml-card"
        (mouseenter)="onCardHover(object)"
        (mouseleave)="onCardLeave(object)"
        [class.hovered]="hoveredObjectUri === object.uri">
        <div class="ml-card-content">
          <!-- Left side: ML Icon + Columns (1/3) -->
          <div class="ml-left-section">
            <div class="ml-icon-container">
              <span
                nz-icon
                nzType="experiment"
                nzTheme="twotone"
                class="ml-model-icon"></span>
            </div>

            <!-- Columns Section -->
            <div class="ml-columns-compact">
              <div class="column-section">
                <div class="column-header">
                  <span
                    nz-icon
                    nzType="import"></span>
                  Input Columns
                </div>
                <div class="column-list-compact">
                  <div
                    *ngFor="let column of object.inputColumns"
                    class="column-item-compact">
                    <span class="column-name">{{ column.name }}</span>
                    <span class="column-type">{{ column.type }}</span>
                  </div>
                </div>
              </div>

              <div class="column-section">
                <div class="column-header">
                  <span
                    nz-icon
                    nzType="export"></span>
                  Output Columns
                </div>
                <div class="column-list-compact">
                  <div
                    *ngFor="let column of object.featureColumns"
                    class="column-item-compact">
                    <span class="column-name">{{ column.name }}</span>
                    <span class="column-type">{{ column.type }}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Right side: Metrics and Info (2/3) -->
          <div class="ml-metrics-section">
            <!-- URI Info -->
            <div class="ml-uri-info">
              <span
                nz-icon
                nzType="link"
                class="uri-icon"></span>
              <span class="uri-text">{{ object.uri }}</span>
            </div>

            <!-- Stats Grid -->
            <div class="ml-stats-grid">
              <div class="ml-stat-item">
                <div class="ml-stat-label">
                  <span
                    nz-icon
                    nzType="dashboard"></span>
                  Inference Speed
                </div>
                <div class="ml-stat-value">{{ object.stats.inferenceSpeed }} tuple/s</div>
              </div>

              <div class="ml-stat-item">
                <div class="ml-stat-label">
                  <span
                    nz-icon
                    nzType="fund"></span>
                  F1 Score
                </div>
                <div class="ml-stat-value">{{ object.stats.f1Score }}</div>
              </div>

              <div class="ml-stat-item">
                <div class="ml-stat-label">
                  <span
                    nz-icon
                    nzType="database"></span>
                  Size
                </div>
                <div class="ml-stat-value">{{ object.stats.size }} MB</div>
              </div>

              <div class="ml-stat-item">
                <div class="ml-stat-label">
                  <span
                    nz-icon
                    nzType="team"></span>
                  # Consumer
                </div>
                <div class="ml-stat-value">{{ object.stats.consumerCount }}</div>
              </div>
            </div>
          </div>
        </div>
      </nz-card>
    </div>
  </div>
</div>
