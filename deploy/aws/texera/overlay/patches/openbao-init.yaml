# Initializes the secret store once, over its API: the recovery key goes to a Secret in the
# cluster (for `bao operator generate-root`, should the token ever be lost), the catalog's token
# is the one the deployment chose (texera2-clients' secrets-token, with the root policy like the
# dev stack's), and the token the initialization minted is revoked. Then the `texera` KV mount,
# as on the local cluster. The platform's model key is not loaded here: the store keeps it, and
# `deploy.sh model-key` puts it there.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
spec:
  template:
    spec:
      serviceAccountName: openbao-init
      containers:
        - name: init
          image: alpine/k8s:1.34.1
          env:
            - { name: BAO_ADDR, value: "http://openbao:8200" }
            - name: BAO_TOKEN
              $patch: delete
            - name: ANTHROPIC_API_KEY
              $patch: delete
            - name: SECRETS_TOKEN
              valueFrom: { secretKeyRef: { name: texera2-clients, key: secrets-token } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until curl -sf "$BAO_ADDR/v1/sys/health?uninitcode=200&sealedcode=200" >/dev/null; do sleep 2; done
              if [ "$(curl -sf "$BAO_ADDR/v1/sys/init" | jq -r .initialized)" = "false" ]; then
                init=$(curl -sf -X PUT "$BAO_ADDR/v1/sys/init" -d '{"recovery_shares":1,"recovery_threshold":1}')
                root=$(printf '%s' "$init" | jq -r .root_token)
                until [ "$(curl -sf "$BAO_ADDR/v1/sys/seal-status" | jq -r .sealed)" = "false" ]; do sleep 1; done
                printf '%s' "$init" | jq -r '.recovery_keys_b64[0]' | kubectl create secret generic openbao-recovery --from-file=recovery-key=/dev/stdin
                jq -n --arg id "$SECRETS_TOKEN" '{id: $id, policies: ["root"], no_parent: true, no_default_policy: true}' \
                  | curl -sf -H "X-Vault-Token: $root" -X POST "$BAO_ADDR/v1/auth/token/create" -d @- >/dev/null
                curl -sf -H "X-Vault-Token: $root" -X POST "$BAO_ADDR/v1/auth/token/revoke-self"
                echo "secret store initialized"
              fi
              if ! curl -sf -H "X-Vault-Token: $SECRETS_TOKEN" "$BAO_ADDR/v1/sys/mounts" | jq -e '."texera/"' >/dev/null; then
                curl -sf -H "X-Vault-Token: $SECRETS_TOKEN" -X POST "$BAO_ADDR/v1/sys/mounts/texera" -d '{"type":"kv","options":{"version":"2"}}'
              fi
              echo "secret mount texera ready"
