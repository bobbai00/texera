# The catalog's object store is S3: no endpoint (the region's own), no key (its pod identity),
# its bucket; and the lake's bucket, which the lake reaches through the warehouse role.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  template:
    spec:
      containers:
        - name: catalog
          env:
            - { name: AWS_REGION, value: "${region}" }
            - { name: TEXERA_S3_ENDPOINT, value: "" }
            - { name: TEXERA_S3_PUBLIC_ENDPOINT, value: "" }
            - { name: TEXERA_S3_REGION, value: "${region}" }
            - { name: TEXERA_S3_PATH_STYLE, value: "false" }
            - { name: TEXERA_S3_ACCESS_KEY, value: "" }
            - { name: TEXERA_S3_SECRET_KEY, value: "" }
            - { name: TEXERA_S3_BUCKET, value: "${datasets_bucket}" }
            - { name: TEXERA_LAKE_S3_ENDPOINT, value: "" }
            - { name: TEXERA_LAKE_BUCKET, value: "${lake_bucket}" }
            - { name: TEXERA_LAKE_S3_ROLE_ARN, value: "${lake_role_arn}" }
            - { name: TEXERA_LAKE_S3_EXTERNAL_ID, value: "${lake_external_id}" }
