# Lakekeeper reaches S3 as itself, through its service account's pod identity, assuming the
# warehouse role the catalog names in the warehouse's storage profile; the server must allow
# that credential type. It fetches the issuer's discovery document from the public URL, a
# public name the pod resolves and reaches like any other, so the socat sidecar the local
# cluster needs for localhost goes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
spec:
  template:
    spec:
      serviceAccountName: lakekeeper
      containers:
        - name: auth
          $patch: delete
        - name: lakekeeper
          env:
            - { name: AWS_REGION, value: "${region}" }
            - { name: LAKEKEEPER__ENABLE_AWS_SYSTEM_CREDENTIALS, value: "true" }
            - { name: LAKEKEEPER__S3_REQUIRE_EXTERNAL_ID_FOR_SYSTEM_CREDENTIALS, value: "true" }
