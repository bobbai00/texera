# The secret store unsealed by the KMS key through its service account's pod identity (the
# config main.tf renders replaces the base's), so it has no static key, and initialized by the
# init job, so it needs no token of its own. It answers ready while uninitialized or sealed too,
# so that the init job can reach it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
spec:
  template:
    spec:
      serviceAccountName: openbao
      containers:
        - name: openbao
          env:
            - name: TEXERA_SECRETS_SEAL_KEY
              $patch: delete
            - name: TEXERA_SECRETS_TOKEN
              $patch: delete
          readinessProbe:
            httpGet:
              path: /v1/sys/health?uninitcode=200&sealedcode=200
              port: 8200
