# A stateful set's volume on EBS, at the deployment's size (the base asks for a few gigabytes of
# whatever the local cluster provides). Volume claim templates are replaced whole.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${name}
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: ${size}
