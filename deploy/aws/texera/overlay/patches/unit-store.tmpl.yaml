# The public unit reads dataset files by the presigned URLs the catalog gives it and writes
# results through the credentials the lake vends: it holds no key to the store. Its S3 settings
# name the region's own S3 and no key, as the catalog gives the units it starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unit
spec:
  template:
    spec:
      containers:
        - name: unit
          env:
            - { name: STORAGE_S3_ENDPOINT, value: "" }
            - { name: STORAGE_S3_REGION, value: "${region}" }
            - { name: STORAGE_S3_AUTH_USERNAME, value: "" }
            - { name: STORAGE_S3_AUTH_PASSWORD, value: "" }
