# The base's object store, RustFS, and the job that makes its buckets: on AWS the store is S3,
# whose buckets the cluster module makes, so these leave the render.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
$patch: delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-buckets
$patch: delete
