# The secret store's volume, its service account (the cluster binds the unseal key's pod identity
# to it), and the init job's account, which may keep the recovery key as a Secret.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-init
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-recovery"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-init
subjects:
  - kind: ServiceAccount
    name: openbao-init
roleRef:
  kind: Role
  name: openbao-init
  apiGroup: rbac.authorization.k8s.io
