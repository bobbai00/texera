# The catalog manages computing units as Deployments and Services in its own namespace, and
# nothing else: the least it needs to make a unit resource a running engine.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-units
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-units
subjects:
  - kind: ServiceAccount
    name: catalog
roleRef:
  kind: Role
  name: catalog-units
  apiGroup: rbac.authorization.k8s.io
