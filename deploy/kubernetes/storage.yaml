# Object storage (RustFS, S3 API) for datasets and result tables, and the Iceberg REST catalog
# (Lakekeeper) the computing units write results through. A job makes the buckets; Lakekeeper's
# warehouses are the catalog's resources, and the catalog makes them.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: { app: rustfs }
  ports:
    - { name: s3, port: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels: { app: rustfs }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      # RustFS runs as its own user; a fresh volume belongs to root until it is given to that group.
      securityContext: { fsGroup: 10001 }
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0
          env:
            - { name: RUSTFS_ACCESS_KEY, value: texera }
            - { name: RUSTFS_SECRET_KEY, value: texera-secret }
            - { name: RUSTFS_VOLUMES, value: /data }
            - { name: RUSTFS_ADDRESS, value: "0.0.0.0:9000" }
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: { path: /health, port: 9000 }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-buckets
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: buckets
          image: rustfs/rc:v0.1.35
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              rc alias set local http://rustfs:9000 texera texera-secret --region us-east-1 --bucket-lookup path
              rc bucket create --ignore-existing local/texera
              rc bucket create --ignore-existing local/datasets
              echo "buckets ready"
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper
spec:
  selector: { app: lakekeeper }
  ports:
    - { name: http, port: 8181 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
spec:
  replicas: 1
  selector:
    matchLabels: { app: lakekeeper }
  template:
    metadata:
      labels: { app: lakekeeper }
    spec:
      # Lakekeeper authenticates every caller against Keycloak and authorizes with OpenFGA (a
      # store of its own on the same server). The catalog is its operator: it creates the
      # warehouse and hands each unit's identity the namespaces of the runs it executes.
      # Keycloak's discovery document names the public issuer (localhost:28088), so the auth
      # sidecar forwards that address, in this pod, to the gateway.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U texera; do sleep 2; done"]
        - name: wait-for-keycloak
          image: alpine:3.19
          command: ["sh", "-c", "until wget -q -O /dev/null http://keycloak:8080/auth/realms/texera; do sleep 3; done"]
        - name: migrate
          image: vakamo/lakekeeper:v0.11.0
          command: ["/home/nonroot/lakekeeper"]
          args: ["migrate"]
          env:
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: texera2-clients, key: lakekeeper-encryption-key } }
            - { name: LAKEKEEPER__PG_DATABASE_URL_READ, value: "postgres://texera:texera@postgres:5432/lakekeeper" }
            - { name: LAKEKEEPER__PG_DATABASE_URL_WRITE, value: "postgres://texera:texera@postgres:5432/lakekeeper" }
            # Returned to Iceberg clients, all of which run in the cluster.
            - { name: LAKEKEEPER__BASE_URI, value: "http://lakekeeper:8181" }
            - { name: LAKEKEEPER__ENABLE_DEFAULT_PROJECT, value: "true" }
            - { name: LAKEKEEPER__LISTEN_PORT, value: "8181" }
            - { name: LAKEKEEPER__AUTHZ_BACKEND, value: openfga }
            - { name: LAKEKEEPER__OPENFGA__ENDPOINT, value: "http://openfga:8081" }
            - name: LAKEKEEPER__OPENID_PROVIDER_URI
              valueFrom: { configMapKeyRef: { name: texera2-public, key: issuer } }
            - { name: RUST_LOG, value: info }
      containers:
        - name: lakekeeper
          image: vakamo/lakekeeper:v0.11.0
          command: ["/home/nonroot/lakekeeper"]
          args: ["serve"]
          env:
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: texera2-clients, key: lakekeeper-encryption-key } }
            - { name: LAKEKEEPER__PG_DATABASE_URL_READ, value: "postgres://texera:texera@postgres:5432/lakekeeper" }
            - { name: LAKEKEEPER__PG_DATABASE_URL_WRITE, value: "postgres://texera:texera@postgres:5432/lakekeeper" }
            # Returned to Iceberg clients, all of which run in the cluster.
            - { name: LAKEKEEPER__BASE_URI, value: "http://lakekeeper:8181" }
            - { name: LAKEKEEPER__ENABLE_DEFAULT_PROJECT, value: "true" }
            - { name: LAKEKEEPER__LISTEN_PORT, value: "8181" }
            - { name: LAKEKEEPER__AUTHZ_BACKEND, value: openfga }
            - { name: LAKEKEEPER__OPENFGA__ENDPOINT, value: "http://openfga:8081" }
            - name: LAKEKEEPER__OPENID_PROVIDER_URI
              valueFrom: { configMapKeyRef: { name: texera2-public, key: issuer } }
            - { name: RUST_LOG, value: info }
          ports:
            - containerPort: 8181
          readinessProbe:
            exec: { command: ["/home/nonroot/lakekeeper", "healthcheck"] }
            periodSeconds: 5
        - name: auth
          image: alpine/socat:1.8.0.0
          # The public port of k8s.sh (kind maps 30088 to localhost:28088); the gateway Service
          # listens on the same number.
          args: ["TCP4-LISTEN:28088,fork,reuseaddr,bind=127.0.0.1", "TCP:gateway:28088"]
