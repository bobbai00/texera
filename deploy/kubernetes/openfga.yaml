# OpenFGA holds the relationship tuples the catalog's policy decision point mirrors its grants to.
apiVersion: v1
kind: Service
metadata:
  name: openfga
spec:
  selector: { app: openfga }
  ports:
    - { name: http, port: 8080 }
    # Lakekeeper speaks gRPC to it.
    - { name: grpc, port: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
spec:
  replicas: 1
  selector:
    matchLabels: { app: openfga }
  template:
    metadata:
      labels: { app: openfga }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U texera; do sleep 2; done"]
        - name: migrate
          image: openfga/openfga:v1.11.2
          args: ["migrate"]
          env:
            - { name: OPENFGA_DATASTORE_ENGINE, value: postgres }
            - { name: OPENFGA_DATASTORE_URI, value: "postgres://texera:texera@postgres:5432/openfga?sslmode=disable" }
      containers:
        - name: openfga
          image: openfga/openfga:v1.11.2
          args: ["run"]
          env:
            - { name: OPENFGA_DATASTORE_ENGINE, value: postgres }
            - { name: OPENFGA_DATASTORE_URI, value: "postgres://texera:texera@postgres:5432/openfga?sslmode=disable" }
            - { name: OPENFGA_LOG_FORMAT, value: json }
            - { name: OPENFGA_PLAYGROUND_ENABLED, value: "false" }
            # The lake asks if a unit may list warehouses by walking every namespace and table for it,
            # and every Python worker asks as it starts: past the default 3 s on a warehouse with history.
            - { name: OPENFGA_REQUEST_TIMEOUT, value: 30s }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
