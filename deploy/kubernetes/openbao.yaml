# OpenBao, the secret store. It keeps the platform's model key (platform/anthropic), the bio
# server's key (platform/biomcp), the client secret of every unit the catalog provisions
# (units/<rid>) and the values of the credentials people make (credentials/<rid>). Its data is
# on a volume and it unseals itself with the dev stack's key (texera2-clients' secrets-seal-key;
# deploy/aws unseals with KMS), so a restart, of the pod or of the whole host, brings all of it
# back. On its first start, on an empty volume, it initializes itself: the `texera` KV v2 mount
# and the catalog's token (texera2-clients' secrets-token, with the root policy). k8s.sh puts
# the model key there through the store's CLI in its pod.
apiVersion: v1
kind: Service
metadata:
  name: openbao
spec:
  selector: { app: openbao }
  ports:
    - { name: http, port: 8200 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
data:
  server.hcl: |
    ui            = false
    disable_mlock = true
    api_addr      = "http://openbao:8200"

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

    storage "file" {
      path = "/openbao/file"
    }

    # 32 bytes; a key of another length stops the server at its start.
    seal "static" {
      current_key_id = "texera-dev"
      current_key    = "env://TEXERA_SECRETS_SEAL_KEY"
    }

    # Once, on an empty volume, as a root token that is revoked afterwards.
    initialize "texera" {
      request "mount" {
        operation = "update"
        path      = "sys/mounts/texera"
        data = {
          type    = "kv"
          options = { version = "2" }
        }
      }
      request "catalog-token" {
        operation = "update"
        path      = "auth/token/create"
        data = {
          id = {
            eval_type   = "string"
            eval_source = "env"
            env_var     = "TEXERA_SECRETS_TOKEN"
          }
          policies          = ["root"]
          no_parent         = true
          no_default_policy = true
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
spec:
  replicas: 1
  # One server on the volume at a time: the old pod is gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: openbao }
  template:
    metadata:
      labels: { app: openbao }
    spec:
      # The server runs in the image's openbao group; a fresh volume belongs to root.
      securityContext:
        fsGroup: 1000
      containers:
        - name: openbao
          image: openbao/openbao:2.4.1
          # The image's entrypoint adds the config, /openbao/config.
          args: ["server"]
          env:
            - { name: BAO_ADDR, value: "http://127.0.0.1:8200" }
            - name: TEXERA_SECRETS_SEAL_KEY
              valueFrom: { secretKeyRef: { name: texera2-clients, key: secrets-seal-key } }
            - name: TEXERA_SECRETS_TOKEN
              valueFrom: { secretKeyRef: { name: texera2-clients, key: secrets-token } }
          ports:
            - containerPort: 8200
          # Ready once initialized and unsealed.
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /openbao/config, readOnly: true }
            - { name: data, mountPath: /openbao/file }
      volumes:
        - name: config
          configMap: { name: openbao-config }
        - name: data
          persistentVolumeClaim: { claimName: openbao-data }
