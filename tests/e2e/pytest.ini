# The end-to-end scenarios of Texera 2.0, against a running stack. See docs/texera-2-0/TESTING.md.
[pytest]
testpaths = .
addopts = -ra --strict-markers -p no:cacheprovider
junit_family = xunit2
log_cli = false
markers =
    model: drives a real agent through a real model; needs the runtime to hold a model key (--model)
    cluster: needs the Kubernetes deployment and kubectl (--cluster)
    local: needs the host processes of the Compose stack, not a cluster (--local)
    destructive: changes what other tests may see (restarts the unit, expires every run); run last
    slow: takes more than a minute
