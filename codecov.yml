# Codecov configuration for apache/texera (Texera 2.0). CI uploads four flags, one per build job
# (.github/workflows/build.yml): catalog (Go), engine (Scala, JaCoCo), python-worker (pytest) and
# typescript (Bun, lcov). Without an explicit config, defaults bite us in three places that this
# file fixes:
#   1. A job that did not upload leaves its flag as `?` in the comment and drops it from the
#      rollup; carrying forward the base-branch report backfills it.
#   2. Coverage of generated code (the contract's generated server and clients, protobuf), build
#      output, and the tests themselves dilutes the "real" coverage figure. Ignore those paths.
#   3. Default status checks fail on any project drop and require 100% patch coverage, so
#      non-test refactors get a red Codecov check even when behavior is preserved. Allow 1% slack
#      on project and require 60% patch coverage.

flag_management:
  default_rules:
    # If the current PR didn't run the job for a given flag, inherit
    # the latest report on the base branch instead of showing `?`.
    carryforward: true

ignore:
  # Generated from the contract and from protobuf; line counts swamp real code.
  - "gen/**"
  - "catalog/internal/api/**"
  - "catalog/internal/engine/engine.gen.go"
  - "catalog/internal/mcp/tools.gen.go"
  - "packages/catalog-client/src/gen/**"
  - "amber/src/main/python/proto/**"
  - "**/src_managed/**"          # scalapb-generated sources
  # Build / install output — never source-of-truth.
  - "**/target/**"
  - "**/dist/**"
  - "**/node_modules/**"
  # Test files don't count toward source coverage.
  - "**/test_*.py"
  - "**/*.test.ts"
  - "**/*_test.go"
  - "**/src/test/**"             # sbt test source roots
  # Third-party vendored sources, mirroring .licenserc.yaml: not maintained here, so their
  # coverage carries no signal.
  - "common/workflow-operator/src/main/scala/com/kjetland/**"          # MIT JSON schema generator

coverage:
  status:
    project:
      default:
        # Don't drop below the base-branch baseline, but tolerate
        # ≤1% jitter from re-runs / flaky tests / ignore-rule churn.
        target: auto
        threshold: 1%
    patch:
      default:
        # Require new/changed lines in a PR to be at least 60% covered.
        # Lower than a 100%-patch policy so legitimate refactors and
        # config-only changes aren't blocked, but high enough that net-new
        # code ships with tests. The 10% threshold softens the quantization
        # on tiny diffs (e.g. a 2-coverable-line change passes at 1 line /
        # 50%) — patch passes when coverage is >= target - threshold = 50%.
        target: 60%
        threshold: 10%

comment:
  # A job that failed before uploading leaves its flag to carryforward; this surfaces those
  # carried rows (rendered `<ø>`) instead of hiding them, so every PR's table lists all flags.
  show_carryforward_flags: true
