# oapi-codegen configuration for the catalog's contract types. The server itself is generic
# (one handler set over the kind table) and is validated against the embedded document in
# tests; only the models are generated. Run `make generate` at the repo root.
package: api
output: internal/api/types.gen.go
generate:
  models: true
  embedded-spec: true
output-options:
  skip-prune: false
  nullable-type: true
compatibility:
  always-prefix-enum-values: true
